<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="ICE Lab, American University of Bahrain: equipment catalog, lab booking, 30 virtual benches with data analysis and calibration, and the Manufacturing Lab with its own machine simulations.">
<meta name="theme-color" content="#050A1A">
<link rel="icon" type="image/png" href="img/ice-mark.png">
<meta property="og:title" content="ICE Lab · American University of Bahrain">
<meta property="og:description" content="Book lab equipment, run the virtual benches and analyse your data.">
<meta property="og:image" content="img/ice-mark.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equipment catalog</title>
<script src="./support.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-tpl">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Montserrat:wght@600;700;800&amp;display=swap">
<style>
body{margin:0;background:#050A1A}
a{color:#8FB3FF}a:hover{color:#C3D5FF}
</style>
</helmet>
<div style="font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #E8ECF8; background: #050A1A; color-scheme: dark; min-height: 100vh">

<style>.ice-hd{position:sticky;top:0;z-index:20;background:rgba(5,10,26,.92);backdrop-filter:blur(10px);border-bottom:1px solid #16224A;font-family:"IBM Plex Sans",system-ui,sans-serif}.ice-hd .in{max-width:1400px;margin:0 auto;padding:10px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;box-sizing:border-box}.ice-hd .brand{display:flex;align-items:center;gap:12px;text-decoration:none}.ice-hd .brand img{height:30px;width:auto}.ice-hd nav{display:flex;flex-wrap:wrap;gap:2px;flex:1 1 auto;justify-content:flex-end}.ice-hd nav a{color:#B7C2E2;text-decoration:none;padding:10px 12px;font-size:15px;white-space:nowrap}.ice-hd nav a:hover{color:#fff}.ice-hd nav a[aria-current]{color:#fff;font-weight:600;box-shadow:inset 0 -2px 0 #3A7BFF}@media (max-width:720px){.ice-hd .in{padding:8px 12px;gap:8px}.ice-hd nav{flex:1 1 100%;min-width:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin:0}.ice-hd nav a{padding:9px 2px;font-size:13.5px;text-align:center;border-radius:6px;background:#0B1636;border:1px solid #16224A;overflow:hidden;text-overflow:ellipsis}.ice-hd nav a[aria-current]{box-shadow:none;background:#1F55E0;border-color:#1F55E0}}@media (max-width:360px){.ice-hd nav a{font-size:12.5px;padding:9px 0;letter-spacing:-.01em}}@media (pointer:coarse){button[role=tab]{position:relative}button[role=tab]::after{content:"";position:absolute;inset:-16px -5px}a[href="Main.dc.html"]:not(nav a),footer a{display:inline-block;padding:8px 0}}@media (max-width:720px){#q{width:100%;min-width:0;box-sizing:border-box}div:has(>#q){min-width:0;flex:1 1 100%!important}input:not([type=range]):not([type=checkbox]):not([type=radio]),select,textarea{font-size:16px!important}}</style><header class="ice-hd"><div class="in"><a class="brand" href="Home.dc.html" aria-label="ICE Lab home"><img src="img/ice-mark.png" alt=""><img src="img/ice-wordmark.png" alt="ICE LAB"></a><nav aria-label="Main"><a href="Home.dc.html">Home</a><a href="Main.dc.html" aria-current="page">Equipment</a><a href="SimHub.dc.html">Simulation</a><a href="Manufacturing.dc.html">Manufacturing</a><a href="Booking.dc.html">Book</a><a href="MyBookings.dc.html">My requests</a></nav></div></header>

<main style="max-width: 1280px; margin: 0 auto; padding: 40px 32px 64px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">

<section style="display: flex; flex-direction: column; gap: 8px">
<p style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #6E95FF">Mechanical Engineering Labs</p>
<h1 style="margin: 0; font-family: 'Montserrat', sans-serif; letter-spacing: -.01em; font-size: 40px; line-height: 1.15; font-weight: 700">Book lab equipment</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.5; color: #8E9AC0; max-width: 680px">Choose a lab, pick a machine or apparatus and request a time slot. A lab technician reviews every booking before it is confirmed.</p>
</section>

<div role="tablist" aria-label="Lab" style="display: flex; flex-wrap: wrap; gap: 12px">
<sc-for list="{{labs}}" as="l" hint-placeholder-count="2">
<sc-if value="{{l.active}}" hint-placeholder-val="{{false}}">
<button type="button" role="tab" aria-selected="true" onClick="{{l.pick}}" style="flex: 1 1 280px; text-align: left; padding: 16px 18px; border: 2px solid #5B8CFF; border-radius: 10px; background: #0B1636; color: #E8ECF8; font: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 18px; font-weight: 600">{{l.name}}</span>
<span style="font-size: 14px; color: #8E9AC0">{{l.meta}}</span>
</button>
</sc-if>
<sc-if value="{{l.idle}}" hint-placeholder-val="{{true}}">
<button type="button" role="tab" aria-selected="false" onClick="{{l.pick}}" style="flex: 1 1 280px; text-align: left; padding: 16px 18px; border: 1px solid #1D2C5E; border-radius: 10px; background: #0E1A40; color: #E8ECF8; font: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 18px; font-weight: 500">{{l.name}}</span>
<span style="font-size: 14px; color: #8E9AC0">{{l.meta}}</span>
</button>
</sc-if>
</sc-for>
</div>

<form style="background: #0B1636; border: 1px solid #1D2C5E; border-radius: 10px; padding: 20px; display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 6px; flex: 2 1 280px">
<label for="q" style="font-size: 14px; font-weight: 500">Search</label>
<input id="q" type="search" value="{{q}}" onChange="{{setQ}}" placeholder="Machine name, number or use" style="height: 44px; padding: 0 12px; border: 1px solid #2C4699; border-radius: 6px; font: inherit; font-size: 15px; color: #E8ECF8; background: #0B1636">
</div>
<div style="display: flex; flex-direction: column; gap: 6px; flex: 1 1 200px">
<label for="st" style="font-size: 14px; font-weight: 500">Status</label>
<select id="st" onChange="{{setOnlyOk}}" style="height: 44px; padding: 0 10px; border: 1px solid #2C4699; border-radius: 6px; font: inherit; font-size: 15px; color: #E8ECF8; background: #0B1636">
<option value="all">All statuses</option><option value="ok">Bookable only</option>
</select>
</div>

</form>

<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<div role="group" aria-label="Filter by section" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
<sc-if value="{{c.active}}" hint-placeholder-val="{{false}}">
<button type="button" aria-pressed="true" onClick="{{c.pick}}" style="height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #3A6BFF; background: #1C3A9E; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer">{{c.label}}</button>
</sc-if>
<sc-if value="{{c.idle}}" hint-placeholder-val="{{true}}">
<button type="button" aria-pressed="false" onClick="{{c.pick}}" style="height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #2C4699; background: #0B1636; color: #E8ECF8; font: inherit; font-size: 14px; cursor: pointer">{{c.label}}</button>
</sc-if>
</sc-for>
</div>
<p style="margin: 0; font-size: 14px; color: #8E9AC0">{{countLabel}}</p>
</div>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<section style="display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 8px 0 0; font-size: 22px; font-weight: 600; display: flex; align-items: baseline; gap: 10px">{{g.title}} <span style="font-size: 14px; font-weight: 400; color: #8E9AC0">{{g.count}}</span></h2>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px">
<sc-for list="{{g.items}}" as="m" hint-placeholder-count="4">
<article style="background: #0B1636; border: 1px solid #1D2C5E; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<img src="{{m.img}}" alt="" loading="lazy" style="width: 100%; aspect-ratio: 640 / 420; object-fit: cover; border-radius: 8px; background: #14214A; display: block">
<div style="display: flex; gap: 12px; align-items: flex-start">
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1 1 auto">
<div style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8E9AC0">{{m.no}}</span>
<sc-if value="{{m.ok}}" hint-placeholder-val="{{true}}"><span style="font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: #0F2E22; color: #6EE7A8">Operational</span></sc-if>
<sc-if value="{{m.maint}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: #3A2A0B; color: #FCD34D">Needs maintenance</span></sc-if>
<sc-if value="{{m.out}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: #3B1515; color: #FCA5A5">Out of service</span></sc-if>
<sc-if value="{{m.untested}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: #14214A; color: #B7C2E2">Not tested</span></sc-if>
</div>
<h3 style="margin: 0; font-size: 17px; line-height: 1.3; font-weight: 600">{{m.name}}</h3>
</div>
</div>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #B7C2E2; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden">{{m.desc}}</p>
<p style="margin: 0; font-size: 13px; line-height: 1.45; color: #8E9AC0"><span style="font-weight: 600; color: #B7C2E2">{{m.extraLabel}}</span> {{m.extra}}</p>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 600; letter-spacing: .04em; color: #FCD34D">Required PPE</span><ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{m.ppe}}" as="p" hint-placeholder-count="3"><li title="{{p.t}} {{p.s}}" style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 999px; border: 1px solid #3A3213; background: rgba(252,211,77,.07); font-size: 12.5px; color: #E8ECF8"><span aria-hidden="true" style="font-size: 15px; line-height: 1">{{p.e}}</span><span>{{p.t}}</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #A7B1BF">{{p.s}}</span></li></sc-for></ul></div>
<div style="display: flex; gap: 10px; margin-top: auto">
<sc-if value="{{m.sim}}" hint-placeholder-val="{{true}}"><a href="{{m.sim}}" style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 6px; border: 1px solid #2C4699; background: #0E1A40; color: #E8ECF8; text-decoration: none; font-size: 15px; font-weight: 600">Simulation</a></sc-if>
<sc-if value="{{m.nosim}}" hint-placeholder-val="{{false}}"><a href="{{m.book}}" style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 6px; border: 1px solid #2C4699; color: #E8ECF8; text-decoration: none; font-size: 15px; font-weight: 500">Details</a></sc-if>
<sc-if value="{{m.ok}}" hint-placeholder-val="{{true}}">
<a href="{{m.book}}" style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 6px; background: linear-gradient(135deg, #2A6BFF, #0B33C9); color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 600">Book</a>
</sc-if>
<sc-if value="{{m.blocked}}" hint-placeholder-val="{{false}}">
<button type="button" disabled="" style="flex: 1 1 auto; height: 44px; border: 0; border-radius: 6px; background: #101B3D; color: #8E9AC0; font: inherit; font-size: 15px">Not bookable</button>
</sc-if>
</div>
</article>
</sc-for>
</div>
</section>
</sc-for>

<sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; padding: 40px; text-align: center; color: #8E9AC0; background: #0B1636; border: 1px solid #1D2C5E; border-radius: 10px">No equipment matches your search.</p>
</sc-if>

</main>
</div>
</script>

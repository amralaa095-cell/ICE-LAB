<rect x="60" y="140" width="860" height="28" fill="#0039a6"/>
<text x="68" y="159" font-size="12.5" font-weight="800" fill="#fff">#</text>
<text x="108" y="159" font-size="12.5" font-weight="800" fill="#fff">Code</text>
<text x="178" y="159" font-size="12.5" font-weight="800" fill="#fff">Machine</text>
<text x="368" y="159" font-size="12.5" font-weight="800" fill="#fff">Operation</text>
<rect x="60" y="168" width="860" height="44" fill="#fff" stroke="#d9dde2" stroke-width="1"/>
<text x="68" y="195" font-size="13" font-weight="800" fill="#1b2433">1</text>
<text x="108" y="195" font-size="13" font-weight="800" fill="#0039a6">M-01</text>
<text x="178" y="195" font-size="13" font-weight="600" fill="#1b2433">Wood lathe</text>
<text x="368" y="186" font-size="13" fill="#1b2433">Turn the square blank round between centres to Ø41, 90 long. Mark the 80</text>
<text x="368" y="203" font-size="13" fill="#1b2433">length.</text>
<rect x="60" y="212" width="860" height="44" fill="#f5f6f8" stroke="#d9dde2" stroke-width="1"/>
<text x="68" y="239" font-size="13" font-weight="800" fill="#1b2433">2</text>
<text x="108" y="239" font-size="13" font-weight="800" fill="#0039a6">M-06</text>
<text x="178" y="239" font-size="13" font-weight="600" fill="#1b2433">Metal lathe</text>
<text x="368" y="230" font-size="13" fill="#1b2433">Hold in the 3-jaw chuck. Face both ends to 80, finish Ø40, turn the groove 2 ×</text>
<text x="368" y="247" font-size="13" fill="#1b2433">1, chamfer 2 × 45°.</text>
<rect x="60" y="256" width="860" height="44" fill="#fff" stroke="#d9dde2" stroke-width="1"/>
<text x="68" y="283" font-size="13" font-weight="800" fill="#1b2433">3</text>
<text x="108" y="283" font-size="13" font-weight="800" fill="#0039a6">M-02</text>
<text x="178" y="283" font-size="13" font-weight="600" fill="#1b2433">Pearl drill</text>
<text x="368" y="274" font-size="13" fill="#1b2433">Part in the chuck: centre-drill, then drill Ø6, Ø10, Ø12 × 60 deep in steps.</text>
<rect x="60" y="300" width="860" height="44" fill="#f5f6f8" stroke="#d9dde2" stroke-width="1"/>
<text x="68" y="327" font-size="13" font-weight="800" fill="#1b2433">4</text>
<text x="108" y="327" font-size="13" font-weight="800" fill="#0039a6">M-05</text>
<text x="178" y="327" font-size="13" font-weight="600" fill="#1b2433">6-axis mill</text>
<text x="368" y="318" font-size="13" fill="#1b2433">Dividing head: mill the bottom 20 mm to hex 34 AF, index 6 × 60°.</text>
<rect x="60" y="344" width="860" height="44" fill="#fff" stroke="#d9dde2" stroke-width="1"/>
<text x="68" y="371" font-size="13" font-weight="800" fill="#1b2433">5</text>
<text x="108" y="371" font-size="13" font-weight="800" fill="#0039a6">M-03</text>
<text x="178" y="371" font-size="13" font-weight="600" fill="#1b2433">Horizontal mill</text>
<text x="368" y="362" font-size="13" fill="#1b2433">Clamp on two hex flats. Mill the flat 2 deep × 35 long above one hex flat.</text>
<rect x="60" y="388" width="860" height="44" fill="#f5f6f8" stroke="#d9dde2" stroke-width="1"/>
<text x="68" y="415" font-size="13" font-weight="800" fill="#1b2433">6</text>
<text x="108" y="415" font-size="13" font-weight="800" fill="#0039a6">M-04</text>
<text x="178" y="415" font-size="13" font-weight="600" fill="#1b2433">Vertical mill + vice</text>
<text x="368" y="406" font-size="13" fill="#1b2433">Part upright, clamp on the hex. Use the dials: drill 3 × Ø8 × 45 on PCD 26.</text>
<rect x="60" y="432" width="860" height="44" fill="#fff" stroke="#d9dde2" stroke-width="1"/>
<text x="68" y="459" font-size="13" font-weight="800" fill="#1b2433">7</text>
<text x="108" y="459" font-size="13" font-weight="800" fill="#0039a6">M-01</text>
<text x="178" y="459" font-size="13" font-weight="600" fill="#1b2433">Disc sander</text>
<text x="368" y="450" font-size="13" fill="#1b2433">Sand the bottom flat and break the hex corners. Light pressure.</text>
<rect x="60" y="476" width="860" height="44" fill="#f5f6f8" stroke="#d9dde2" stroke-width="1"/>
<text x="68" y="503" font-size="13" font-weight="800" fill="#1b2433">8</text>
<text x="108" y="503" font-size="13" font-weight="800" fill="#0039a6">Bench</text>
<text x="178" y="503" font-size="13" font-weight="600" fill="#1b2433">Finish</text>
<text x="368" y="494" font-size="13" fill="#1b2433">Fine sandpaper by hand, oil or wax. Write your name on the flat.</text>
<text x="60" y="580" font-size="13" font-weight="800" fill="#0039a6" letter-spacing="1">WHAT YOU LEARN</text><text x="60" y="602" font-size="12.5" fill="#1b2433">1. Turning wood between centres</text><text x="60" y="621" font-size="12.5" fill="#1b2433">2. Facing, turning and grooving to a size</text><text x="60" y="640" font-size="12.5" fill="#1b2433">3. Drilling deep holes in steps</text><text x="60" y="659" font-size="12.5" fill="#1b2433">4. Indexing with the dividing head</text><text x="60" y="678" font-size="12.5" fill="#1b2433">5. Milling a flat</text><text x="60" y="697" font-size="12.5" fill="#1b2433">6. Using the handwheel dials to place holes</text><text x="60" y="716" font-size="12.5" fill="#1b2433">7. Sanding flat and square</text><text x="60" y="735" font-size="12.5" fill="#1b2433">8. Measuring with calipers</text>

1.2" text-anchor="middle">END VIEW · SPIGOT END</text><rect x="60" y="750" width="900" height="210" rx="10" fill="#f5f6f8"/><text x="76" y="774" font-size="13" font-weight="800" fill="#0039a6" letter-spacing="1">OPERATIONS</text><text x="76" y="804" font-size="12" font-weight="800" fill="#5c6f7c">10</text><rect x="108" y="790" width="56" height="20" rx="10" fill="#0039a6"/><text x="136" y="804.5" font-size="11.5" font-weight="800" fill="#fff" text-anchor="middle">M-06</text><text x="174" y="804" font-size="12.5" fill="#1b2433">Metal lathe: face both ends to 75, turn Ø14 × 62, turn the spigot Ø10 × 8, keep the Ø20 flange 5 long.</text><text x="76" y="848" font-size="12" font-weight="800" fill="#5c6f7c">20</text><rect x="108" y="834" width="56" height="20" rx="10" fill="#0039a6"/><text x="136" y="848.5" font-size="11.5" font-weight="800" fill="#fff" text-anchor="middle">M-02</text><text x="174" y="848" font-size="12.5" fill="#1b2433">Pearl drill: centre-drill both ends, drill Ø4.2 × 12, then tap M5 by hand.</text><text x="76" y="892" font-size="12" font-weight="800" fill="#5c6f7c">30</text><rect x="108" y="878" width="56" height="20" rx="10" fill="#0039a6"/><text x="136" y="892.5" font-size="11.5" font-weight="800" fill="#fff" text-anchor="middle">M-05</text><text x="174" y="892" font-size="12.5" fill="#1b2433">6-axis mill with the dividing head: mill the flange to hex 17 AF, index 6 × 60°.</text><text x="76" y="936" font-size="12" font-weight="800" fill="#5c6f7c">40</text><rect x="108" y="922" width="56" height="20" rx="10" fill="#0039a6"/><text x="136" y="936.5" font-size="11.5" font-weight="800" fill="#fff" text-anchor="middle">M-03</text><text x="174" y="936" font-size="12.5" fill="#1b2433">Horizontal mill: mill the flat 1.5 deep × 34 long, 12 from the flange.</text><text x="1000" y="780" font-size="13" font-weight="800" fill="#0039a6" letter-spacing="1">NOTES</text><text x="1000" y="802" font-size="12.5" fill="#1b2433">1. Deburr all edges after each operation.</text><text x="1000" y="821" font-size="12.5" fill="#1b2433">2. Spigot Ø10: slide fit in the pen block, aim for 9.95.</text><text x="1000" y="840" font-size="12.5" fill="#1b2433">3. Hex: check across flats with calipers, 17.0 ±0.2.</text><text x="1000" y="859" font-size="12.5" fill="#1b2433">4. Keep the flat parallel to one hex flat.</text><rect x="793.5" y="934.1" width="755.7" height="151.1" fill="#fff" stroke="#1b2433" stroke-width="2"/><rect x="793.5" y="934.1" width="272.1" height="151.1" fill="#0039a6"/><text x="809.5" y="962.1" font-size="12" font-weight="800" fill="#fff" letter-spacing="1.6" font-family="Liberation Sans, Arial, sans-serif">ICE LAB · AUBH</text><text x="809.5" y="980.1" font-size="11" fill="#fff" opacity=".85" font-family="Liberation Sans, Arial, sans-serif">Manufacturing Lab</text><text x="809.5" y="1020.1" font-size="26" font-weight="700" fill="#fff" font-family="Liberation Serif, Georgia, serif">Desk pen stand</text><text x="809.5" y="1042.1" font-size="12" fill="#fff" opacity=".9" font-family="Liberation Sans, Arial, sans-serif">Intro project · 7 manual machines</text><rect x="809.5" y="1056.1" width="96" height="22" rx="4" fill="#cc092f"/><text x="857.5" y="1072.1" font-size="12" font-weight="800" fill="#fff" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif">ICE-P01-02</text><rect x="1065.6" y="934.1" width="322.4" height="50.4" fill="none" stroke="#1b2433" stroke-width="1"/><text x="1073.6" y="950.1" font-size="10" fill="#5c6f7c" font-family="Liberation Sans, Arial, sans-serif" letter-spacing=".6">SHEET TITLE</text><text x="1073.6" y="972.1" font-size="15" font-weight="700" fill="#1b2433" font-family="Liberation Sans, Arial, sans-serif">Post (item 2)</text><rect x="1388.0" y="934.1" width="161.2" height="50.4" fill="none" stroke="#1b2433" stroke-width="1"/><text x="1396.0" y="950.1" font-size="10" fill="#5c6f7c" font-family="Liberation Sans, Arial, sans-serif" letter-spacing=".6">SHEET</text><text x="1396.0" y="972.1"

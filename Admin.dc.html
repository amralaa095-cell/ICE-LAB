<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — approvals and schedule</title>
<script src="./support.js"></script>
</head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-tpl">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Montserrat:wght@600;700;800&amp;display=swap">
<style>
body{margin:0;background:#050A1A}
a{color:#8FB3FF}a:hover{color:#C3D5FF}
</style>
</helmet>
<div style="font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #E8ECF8; background: #050A1A; color-scheme: dark; min-height: 100vh">

<header style="background: rgba(5,10,26,.92); border-bottom: 1px solid #16224A; color: #FFFFFF">
<div style="max-width: 1280px; margin: 0 auto; padding: 12px 32px; min-height: 64px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 32px">
<a href="Home.dc.html" aria-label="ICE Lab home" style="display: flex; align-items: center; gap: 12px; color: #FFFFFF; text-decoration: none; font-weight: 500; font-size: 15px">
<img src="img/ice-mark.png" alt="" style="width: 30px; height: auto">
<img src="img/ice-wordmark.png" alt="ICE LAB" style="height: 30px; width: auto">
<span style="padding-left: 12px; border-left: 1px solid #2C4699; color: #B7C2E2">Booking</span>
</a>
<nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 4px; flex: 1 1 auto">
<a href="Main.dc.html" style="color: #B7C2E2; text-decoration: none; padding: 10px 14px; border-radius: 6px; font-size: 15px">Equipment</a>
<a href="MyBookings.dc.html" style="color: #B7C2E2; text-decoration: none; padding: 10px 14px; border-radius: 6px; font-size: 15px">My bookings</a>
<a href="Admin.dc.html" aria-current="page" style="color: #FFFFFF; text-decoration: none; padding: 10px 14px; border-radius: 6px; background: #12224F; font-size: 15px; font-weight: 500">Admin</a>
</nav>
<div style="display: flex; align-items: center; gap: 10px">
<span style="width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #2A6BFF, #0B33C9); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600">KM</span>
<span style="font-size: 14px; color: #B7C2E2">Khalid M. · Lab technician</span>
</div>
</div>
</header>

<main style="max-width: 1280px; margin: 0 auto; padding: 40px 32px 64px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">

<div style="display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Montserrat', sans-serif; letter-spacing: -.01em; font-size: 34px; font-weight: 700">Lab admin</h1>
<p style="margin: 0; font-size: 16px; color: #8E9AC0">Review requests and manage the machine schedule.</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<button type="button" style="height: 44px; padding: 0 16px; border: 1px solid #2C4699; border-radius: 6px; background: #0B1636; color: #E8ECF8; font: inherit; font-size: 15px; font-weight: 500; cursor: pointer">Block time for maintenance</button>
<button type="button" style="height: 44px; padding: 0 16px; border: 1px solid #2C4699; border-radius: 6px; background: #0B1636; color: #E8ECF8; font: inherit; font-size: 15px; font-weight: 500; cursor: pointer">Manage equipment</button>
<button type="button" style="height: 44px; padding: 0 16px; border: 0; border-radius: 6px; background: #1C3A9E; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Export CSV</button>
</div>
</div>

<section style="background: #0B1636; border: 1px solid #1D2C5E; border-radius: 10px; overflow: hidden">
<div style="display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid #1D2C5E">
<h2 style="margin: 0; font-size: 18px; font-weight: 600">Requests awaiting approval <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; padding: 2px 8px; border-radius: 4px; background: #3A2A0B; color: #FCD34D">{{pendingCount}}</span></h2>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<label for="fm" style="position: absolute; width: 1px; height: 1px; overflow: hidden">Filter by lab</label>
<select id="fm" style="height: 40px; padding: 0 10px; border: 1px solid #2C4699; border-radius: 6px; font: inherit; font-size: 14px; background: #0B1636; color: #E8ECF8"><option>All labs</option><option>Manufacturing Lab</option><option>ICE Lab</option></select>
<label for="fs" style="position: absolute; width: 1px; height: 1px; overflow: hidden">Sort</label>
<select id="fs" style="height: 40px; padding: 0 10px; border: 1px solid #2C4699; border-radius: 6px; font: inherit; font-size: 14px; background: #0B1636; color: #E8ECF8"><option>Soonest slot first</option><option>Oldest request first</option></select>
</div>
</div>
<div style="overflow-x: auto">
<table style="width: 100%; min-width: 980px; border-collapse: collapse; font-size: 15px">
<thead>
<tr style="text-align: left; color: #8E9AC0; font-size: 13px">
<th scope="col" style="padding: 12px 16px; font-weight: 500">Requester</th>
<th scope="col" style="padding: 12px 16px; font-weight: 500">Machine</th>
<th scope="col" style="padding: 12px 16px; font-weight: 500">Slot</th>
<th scope="col" style="padding: 12px 16px; font-weight: 500">Project</th>
<th scope="col" style="padding: 12px 16px; font-weight: 500">Checks</th>
<th scope="col" style="padding: 12px 16px; font-weight: 500; text-align: right">Decision</th>
</tr>
</thead>
<tbody>
<sc-for list="{{reqs}}" as="r" hint-placeholder-count="4">
<tr style="border-top: 1px solid #16224A; vertical-align: top">
<td style="padding: 14px 16px"><div style="font-weight: 500">{{r.name}}</div><div style="font-size: 13px; color: #8E9AC0">{{r.role}}</div></td>
<td style="padding: 14px 16px"><div style="font-weight: 500">{{r.machine}}</div><div style="font-size: 13px; color: #8E9AC0; font-family: 'IBM Plex Mono', monospace">{{r.ref}}</div></td>
<td style="padding: 14px 16px"><div>{{r.date}}</div><div style="font-size: 13px; font-family: 'IBM Plex Mono', monospace">{{r.time}}</div></td>
<td style="padding: 14px 16px; max-width: 240px"><div>{{r.project}}</div><a href="#" style="font-size: 13px">{{r.file}}</a></td>
<td style="padding: 14px 16px; font-size: 13px">
<sc-if value="{{r.trained}}" hint-placeholder-val="{{true}}"><div style="color: #6EE7A8">✓ Training valid</div></sc-if>
<sc-if value="{{r.untrained}}" hint-placeholder-val="{{false}}"><div style="color: #FCA5A5; font-weight: 600">✕ No training on record</div></sc-if>
<div style="color: #B7C2E2">{{r.tech}}</div>
</td>
<td style="padding: 10px 16px; text-align: right; white-space: nowrap">
<sc-if value="{{r.open}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{r.reject}}" style="height: 40px; padding: 0 14px; margin-right: 6px; border: 1px solid #2C4699; border-radius: 6px; background: #0B1636; color: #FCA5A5; font: inherit; font-size: 14px; font-weight: 500; cursor: pointer">Decline</button>
<button type="button" onClick="{{r.approve}}" style="height: 40px; padding: 0 14px; border: 0; border-radius: 6px; background: #15803D; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Approve</button>
</sc-if>
<sc-if value="{{r.approved}}" hint-placeholder-val="{{false}}"><span style="font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: #0F2E22; color: #6EE7A8">Approved</span></sc-if>
<sc-if value="{{r.declined}}" hint-placeholder-val="{{false}}"><span style="font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px; background: #3B1515; color: #FCA5A5">Declined</span></sc-if>
</td>
</tr>
</sc-for>
</tbody>
</table>
</div>
</section>

<section style="background: #0B1636; border: 1px solid #1D2C5E; border-radius: 10px; overflow: hidden">
<div style="display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid #1D2C5E">
<h2 style="margin: 0; font-size: 18px; font-weight: 600">Schedule · Tue, 10 Nov 2026</h2>
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: center; font-size: 13px; color: #B7C2E2">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 3px; background: #1C3A9E"></span>Approved</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 3px; background: #3A2A0B; border: 1px dashed #F59E0B"></span>Pending</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; border-radius: 3px; background: #2A3A6E"></span>Maintenance</span>
<div style="display: flex; gap: 6px">
<button type="button" aria-label="Previous day" style="width: 40px; height: 40px; border: 1px solid #1D2C5E; border-radius: 6px; background: #0B1636; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E8ECF8" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
<button type="button" style="height: 40px; padding: 0 12px; border: 1px solid #1D2C5E; border-radius: 6px; background: #0B1636; font: inherit; font-size: 14px; cursor: pointer">Today</button>
<button type="button" aria-label="Next day" style="width: 40px; height: 40px; border: 1px solid #1D2C5E; border-radius: 6px; background: #0B1636; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E8ECF8" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
</div>
</div>
</div>
<div style="overflow-x: auto; padding: 8px 20px 20px">
<div style="min-width: 960px; display: flex; flex-direction: column">

<div style="display: grid; grid-template-columns: 200px repeat(10, minmax(0, 1fr)); font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8E9AC0; padding: 8px 0">
<span></span><span>08:00</span><span>09:00</span><span>10:00</span><span>11:00</span><span>12:00</span><span>13:00</span><span>14:00</span><span>15:00</span><span>16:00</span><span>17:00</span>
</div>

<div style="display: grid; grid-template-columns: 200px repeat(10, minmax(0, 1fr)); grid-template-rows: 52px; border-top: 1px solid #16224A">
<span style="grid-row: 1; grid-column: 1; align-self: center; font-size: 14px; font-weight: 500">UNIMAT CNC 3-axis mill · U1</span>
<span style="grid-row: 1; grid-column: 2 / 12; background: repeating-linear-gradient(90deg, #16224A 0 1px, transparent 1px 10%)"></span>
<span style="grid-row: 1; grid-column: 3 / span 2; margin: 6px 2px; border-radius: 6px; background: #3A2A0B; border: 1px dashed #F59E0B; color: #FCD34D; font-size: 12px; padding: 6px 8px; overflow: hidden">Sara A. · pending</span>
<span style="grid-row: 1; grid-column: 5 / span 1; margin: 6px 2px; border-radius: 6px; background: #1C3A9E; color: #FFFFFF; font-size: 12px; padding: 6px 8px; overflow: hidden">Omar K.</span>
<span style="grid-row: 1; grid-column: 8 / span 2; margin: 6px 2px; border-radius: 6px; background: #1C3A9E; color: #FFFFFF; font-size: 12px; padding: 6px 8px; overflow: hidden">Research group B</span>
</div>

<div style="display: grid; grid-template-columns: 200px repeat(10, minmax(0, 1fr)); grid-template-rows: 52px; border-top: 1px solid #16224A">
<span style="grid-row: 1; grid-column: 1; align-self: center; font-size: 14px; font-weight: 500">UNIMAT CNC lathe · U1</span>
<span style="grid-row: 1; grid-column: 2 / 12; background: repeating-linear-gradient(90deg, #16224A 0 1px, transparent 1px 10%)"></span>
<span style="grid-row: 1; grid-column: 2 / span 3; margin: 6px 2px; border-radius: 6px; background: #1C3A9E; color: #FFFFFF; font-size: 12px; padding: 6px 8px; overflow: hidden">MEC 342 lab section</span>
<span style="grid-row: 1; grid-column: 9 / span 1; margin: 6px 2px; border-radius: 6px; background: #3A2A0B; border: 1px dashed #F59E0B; color: #FCD34D; font-size: 12px; padding: 6px 8px; overflow: hidden">Lina S.</span>
</div>

<div style="display: grid; grid-template-columns: 200px repeat(10, minmax(0, 1fr)); grid-template-rows: 52px; border-top: 1px solid #16224A">
<span style="grid-row: 1; grid-column: 1; align-self: center; font-size: 14px; font-weight: 500">Matrix Wind Tunnel</span>
<span style="grid-row: 1; grid-column: 2 / 12; background: repeating-linear-gradient(90deg, #16224A 0 1px, transparent 1px 10%)"></span>
<span style="grid-row: 1; grid-column: 3 / span 4; margin: 6px 2px; border-radius: 6px; background: #1C3A9E; color: #FFFFFF; font-size: 12px; padding: 6px 8px; overflow: hidden">MECH 330 lab · group of 12</span>
<span style="grid-row: 1; grid-column: 8 / span 3; margin: 6px 2px; border-radius: 6px; background: #3A2A0B; border: 1px dashed #F59E0B; color: #FCD34D; font-size: 12px; padding: 6px 8px; overflow: hidden">Nora H. · pending</span>
</div>

<div style="display: grid; grid-template-columns: 200px repeat(10, minmax(0, 1fr)); grid-template-rows: 52px; border-top: 1px solid #16224A">
<span style="grid-row: 1; grid-column: 1; align-self: center; font-size: 14px; font-weight: 500">Laboratory Muffle Furnace</span>
<span style="grid-row: 1; grid-column: 2 / 12; background: repeating-linear-gradient(90deg, #16224A 0 1px, transparent 1px 10%)"></span>
<span style="grid-row: 1; grid-column: 2 / span 10; margin: 6px 2px; border-radius: 6px; background: repeating-linear-gradient(45deg, #2A3A6E 0 8px, #14214A 8px 16px); color: #E8ECF8; font-size: 12px; font-weight: 500; padding: 6px 8px; overflow: hidden">Maintenance — thermocouple &amp; controller calibration</span>
</div>

<div style="display: grid; grid-template-columns: 200px repeat(10, minmax(0, 1fr)); grid-template-rows: 52px; border-top: 1px solid #16224A">
<span style="grid-row: 1; grid-column: 1; align-self: center; font-size: 14px; font-weight: 500">UNI-LASER 3-axis laser</span>
<span style="grid-row: 1; grid-column: 2 / 12; background: repeating-linear-gradient(90deg, #16224A 0 1px, transparent 1px 10%)"></span>
<span style="grid-row: 1; grid-column: 4 / span 2; margin: 6px 2px; border-radius: 6px; background: #1C3A9E; color: #FFFFFF; font-size: 12px; padding: 6px 8px; overflow: hidden">Faisal R. · acrylic panels</span>
</div>

<div style="display: grid; grid-template-columns: 200px repeat(10, minmax(0, 1fr)); grid-template-rows: 52px; border-top: 1px solid #16224A; border-bottom: 1px solid #16224A">
<span style="grid-row: 1; grid-column: 1; align-self: center; font-size: 14px; font-weight: 500">MTS Universal Testing Machine</span>
<span style="grid-row: 1; grid-column: 2 / 12; background: repeating-linear-gradient(90deg, #16224A 0 1px, transparent 1px 10%)"></span>
<span style="grid-row: 1; grid-column: 4 / span 1; margin: 6px 2px; border-radius: 6px; background: #1C3A9E; color: #FFFFFF; font-size: 12px; padding: 6px 8px; overflow: hidden">Sara A.</span>
<span style="grid-row: 1; grid-column: 7 / span 2; margin: 6px 2px; border-radius: 6px; background: #3A2A0B; border: 1px dashed #F59E0B; color: #FCD34D; font-size: 12px; padding: 6px 8px; overflow: hidden">Yousef T.</span>
</div>

</div>
</div>
</section>

<section style="background: #0B1636; border: 1px solid #1D2C5E; border-radius: 10px; overflow: hidden">
<div style="display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: space-between; align-items: baseline; padding: 16px 20px; border-bottom: 1px solid #1D2C5E">
<h2 style="margin: 0; font-size: 18px; font-weight: 600">Log machine inspection</h2>
<span style="font-size: 14px; color: #8E9AC0">Same fields as the lab inspection checklist. Status updates the catalog.</span>
</div>
<form style="padding: 20px; display: flex; flex-direction: column; gap: 20px">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="il" style="font-size: 14px; font-weight: 500">Lab</label>
<select id="il" style="height: 44px; padding: 0 10px; border: 1px solid #2C4699; border-radius: 6px; font: inherit; font-size: 15px; background: #0B1636; color: #E8ECF8"><option>ICE Lab</option><option>Manufacturing Lab</option></select>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="im" style="font-size: 14px; font-weight: 500">Machine <span style="color: #FF8A8A" aria-hidden="true">*</span></label>
<select id="im" style="height: 44px; padding: 0 10px; border: 1px solid #2C4699; border-radius: 6px; font: inherit; font-size: 15px; background: #0B1636; color: #E8ECF8"><option>No. 05 · Laboratory Muffle Furnace</option></select>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="idt" style="font-size: 14px; font-weight: 500">Inspection date <span style="color: #FF8A8A" aria-hidden="true">*</span></label>
<input id="idt" type="date" value="2026-11-05" style="height: 44px; padding: 0 10px; border: 1px solid #2C4699; border-radius: 6px; font: inherit; font-size: 15px; color: #E8ECF8; background: #0B1636">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="iby" style="font-size: 14px; font-weight: 500">Inspector</label>
<input id="iby" type="text" value="Khalid M." style="height: 44px; padding: 0 12px; border: 1px solid #2C4699; border-radius: 6px; font: inherit; font-size: 15px; color: #E8ECF8; background: #0B1636">
</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 28px">
<fieldset style="border: 0; padding: 0; margin: 0; flex: 1 1 220px">
<legend style="font-size: 14px; font-weight: 500; padding: 0; margin-bottom: 8px">Status <span style="color: #FF8A8A" aria-hidden="true">*</span></legend>
<label style="display: flex; gap: 10px; align-items: center; min-height: 40px; font-size: 15px"><input type="radio" name="ist" style="accent-color: #5B8CFF; width: 18px; height: 18px">Operational</label>
<label style="display: flex; gap: 10px; align-items: center; min-height: 40px; font-size: 15px"><input type="radio" name="ist" checked="" style="accent-color: #5B8CFF; width: 18px; height: 18px">Needs maintenance</label>
<label style="display: flex; gap: 10px; align-items: center; min-height: 40px; font-size: 15px"><input type="radio" name="ist" style="accent-color: #5B8CFF; width: 18px; height: 18px">Out of service</label>
<label style="display: flex; gap: 10px; align-items: center; min-height: 40px; font-size: 15px"><input type="radio" name="ist" style="accent-color: #5B8CFF; width: 18px; height: 18px">Not tested</label>
</fieldset>
<fieldset style="border: 0; padding: 0; margin: 0; flex: 1 1 260px">
<legend style="font-size: 14px; font-weight: 500; padding: 0; margin-bottom: 8px">Accessories present &amp; OK</legend>
<label style="display: flex; gap: 10px; align-items: center; min-height: 40px; font-size: 15px"><input type="checkbox" checked="" style="accent-color: #5B8CFF; width: 18px; height: 18px">Crucibles / trays</label>
<label style="display: flex; gap: 10px; align-items: center; min-height: 40px; font-size: 15px"><input type="checkbox" checked="" style="accent-color: #5B8CFF; width: 18px; height: 18px">Tongs</label>
<label style="display: flex; gap: 10px; align-items: center; min-height: 40px; font-size: 15px"><input type="checkbox" style="accent-color: #5B8CFF; width: 18px; height: 18px">Temperature controller</label>
<label style="display: flex; gap: 10px; align-items: center; min-height: 40px; font-size: 15px"><input type="checkbox" style="accent-color: #5B8CFF; width: 18px; height: 18px">Thermocouple</label>
<label style="display: flex; gap: 10px; align-items: center; min-height: 40px; font-size: 15px"><input type="checkbox" checked="" style="accent-color: #5B8CFF; width: 18px; height: 18px">Heat-resistant gloves</label>
<label style="display: flex; gap: 10px; align-items: center; min-height: 40px; font-size: 15px"><input type="checkbox" checked="" style="accent-color: #5B8CFF; width: 18px; height: 18px">Furnace shelf</label>
</fieldset>
<fieldset style="border: 0; padding: 0; margin: 0; flex: 1 1 220px">
<legend style="font-size: 14px; font-weight: 500; padding: 0; margin-bottom: 8px">Required action</legend>
<label style="display: flex; gap: 10px; align-items: center; min-height: 40px; font-size: 15px"><input type="checkbox" checked="" style="accent-color: #5B8CFF; width: 18px; height: 18px">Calibration</label>
<label style="display: flex; gap: 10px; align-items: center; min-height: 40px; font-size: 15px"><input type="checkbox" style="accent-color: #5B8CFF; width: 18px; height: 18px">Repair / maintenance</label>
<label style="display: flex; gap: 10px; align-items: center; min-height: 40px; font-size: 15px"><input type="checkbox" checked="" style="accent-color: #5B8CFF; width: 18px; height: 18px">Replace accessory</label>
<label style="display: flex; gap: 10px; align-items: center; min-height: 40px; font-size: 15px"><input type="checkbox" style="accent-color: #5B8CFF; width: 18px; height: 18px">Cleaning</label>
<label style="display: flex; gap: 10px; align-items: center; min-height: 40px; font-size: 15px"><input type="checkbox" style="accent-color: #5B8CFF; width: 18px; height: 18px">None</label>
</fieldset>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="irm" style="font-size: 14px; font-weight: 500">Remarks</label>
<textarea id="irm" rows="3" style="padding: 10px 12px; border: 1px solid #2C4699; border-radius: 6px; font: inherit; font-size: 15px; color: #E8ECF8; background: #0B1636; resize: vertical">Controller reading drifts from thermocouple. Replace thermocouple and recalibrate before next session.</textarea>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Raleway:wght@400;500;600;700&family=Changa:wght@400;500;600&display=swap">
<title>ICE Lab dashboard</title>
<style>
:root{--bg:#ffffff;--panel:#f5f6f8;--panel2:#ffffff;--line:#dfe3ea;--ink:#1b2433;--ink2:#3d4757;--muted:#5c6f7c;--acc:#0039a6;--acc2:#cc092f;--acc3:#7c2b93;--good:#16703f;--warn:#8a5a00;--bad:#cc092f;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Raleway","Changa",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:lining-nums tabular-nums;font-feature-settings:"lnum" 1,"tnum" 1}
a{color:#0039a6}
header{position:sticky;top:0;z-index:5;background:#0039a6;color:#fff;border-bottom:1px solid #002f8a}header .who{color:#dfe6f5}header button,header .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:#fff}header .pri{background:#fff;color:#0039a6;border-color:#fff}
.hd{max-width:1500px;margin:0 auto;padding:12px 20px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.brand{font:700 21px "Playfair Display",Georgia,serif}.brand span{color:#fff;font-weight:500}
.who{font-size:13.5px;color:var(--muted)}.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;margin-left:6px}
.b-admin{background:#fff;color:#cc092f}.b-viewer{background:#fff;color:#0039a6}.b-demo{background:#fff3d1;color:#8a5a00}
.sp{flex:1}
button,.btn,select,input{font:inherit;font-size:14px;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:7px;height:34px;padding:0 10px}
button,.btn{cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none}button:hover,.btn:hover{border-color:var(--acc)}
.pri{background:#0039a6;border-color:#0039a6;color:#fff;font-weight:600}.pri:hover{background:#002f8a}
main{max-width:1500px;margin:0 auto;padding:16px 20px 60px;display:flex;flex-direction:column;gap:16px}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:end;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}.filters select,.filters input{min-width:130px;max-width:220px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-radius:7px 7px 0 0;background:transparent;color:var(--muted);height:38px;padding:0 14px}
.tabs button[aria-selected=true]{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--acc)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .v{font:700 30px "Playfair Display",Georgia,serif;margin-top:2px;color:#0039a6;font-variant-numeric:lining-nums}.kpi .s{font-size:12.5px;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;min-width:0}
.card h3{margin:0 0 4px;font:700 18px "Playfair Display",Georgia,serif;color:#0039a6}.card .sub{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.ch{display:flex;justify-content:space-between;gap:10px;align-items:start;flex-wrap:wrap}
svg{display:block;width:100%;height:auto;overflow:visible}
.tw{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
td{white-space:nowrap}td.w{white-space:normal;min-width:200px;max-width:300px}th,td{padding:7px 10px;border-bottom:1px solid #e3e6ec;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#e8edf7;color:var(--muted);font-weight:600;font-size:12.5px;cursor:pointer;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}tr.click{cursor:pointer}tr.click:hover td{background:#eef2fa}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;white-space:nowrap}
.st-pend{background:#fff3d1;color:#8a5a00}.st-ok{background:#e2f4e9;color:#16703f}.st-no{background:#fde6eb;color:#a3001f}.st-neu{background:#e8edf7;color:#3d4757}
.muted{color:var(--muted)}.small{font-size:12.5px}
#tip{position:fixed;pointer-events:none;z-index:50;background:#fff;color:#1b2433;border:1px solid var(--acc);border-radius:8px;padding:7px 10px;font-size:13px;max-width:280px;display:none;box-shadow:0 8px 24px rgba(16,24,40,.16)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--ink2);margin-top:8px}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.empty{padding:40px;text-align:center;color:var(--muted)}
.note{background:#e8edf7;border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--ink2);font-size:14px}
.err{background:#fde6eb;border-color:#f3b3c0;color:#a3001f}
@media (max-width:700px){.hd{padding:10px 12px}main{padding:12px}.filters select,.filters input{min-width:0;max-width:none;width:100%}.filters label{flex:1 1 45%}}
</style>
</head>
<body>
<header><div class="hd"><div class="brand">ICE<span>LAB</span> dashboard</div><div class="who" id="who">Loading…</div><div class="sp"></div>
<span id="hdbtns"></span><button id="xall" class="pri" type="button">Export report (.csv)</button></div></header>
<main>
<div id="banner"></div>
<section class="filters" aria-label="Filters">
<label>From<input type="date" id="f-from"></label><label>To<input type="date" id="f-to"></label>
<label>Lab<select id="f-lab"></select></label><label>Equipment<select id="f-eq"></select></label><label>Course code<select id="f-course"></select></label>
<label>Supervisor<select id="f-sup"></select></label><label>Department<select id="f-dept"></select></label><label>Request type<select id="f-type"></select></label>
<label>Status<select id="f-status"><option value="active">All except declined / cancelled</option><option value="all">All</option><option value="ok">Approved, confirmed, completed</option><option value="pend">Pending supervisor</option><option value="no">Declined, cancelled, no-show</option></select></label>
<button type="button" id="f-reset">Reset</button>
</section>
<nav class="tabs" role="tablist" id="tabs"></nav>
<div id="view"></div>
</main>
<div id="tip" role="tooltip"></div>
<script>
const DEMO_EQUIPMENT = [["M-01", "UNIMAT ML Technics", "Manufacturing Lab"], ["M-02", "Pearl / center drilling machine (Metal Line)", "Manufacturing Lab"], ["M-03", "Horizontal milling machine (Metal Line)", "Manufacturing Lab"], ["M-04", "Vertical mill ML with vice", "Manufacturing Lab"], ["M-05", "6-axis mill ML", "Manufacturing Lab"], ["M-06", "Metal lathe with power motor", "Manufacturing Lab"], ["M-07", "UNIMAT CNC 3-axis mill (extended, SC spindle)", "Manufacturing Lab"], ["M-08", "UNIMAT CNC lathe", "Manufacturing Lab"], ["M-09", "UNIMAT CNC 4-axis turn-mill", "Manufacturing Lab"], ["M-10", "UNI-LASER 3-axis laser (enclosed)", "Manufacturing Lab"], ["M-11", "UNIMAT CNC hot wire cutter 3D", "Manufacturing Lab"], ["01", "METCO Bainpol Auto — Automated Polishing Machine", "ICE Lab"], ["02", "METCO Bainmount Twin H Auto — Specimen Mounting Press", "ICE Lab"], ["03", "Vickers / Microhardness Testing System", "ICE Lab"], ["04", "METCO Metallographic Abrasive Cutting Machine", "ICE Lab"], ["06", "Haver EML Digital Plus Sieve Shaker", "ICE Lab"], ["07", "Direct Shear Testing Machine", "ICE Lab"], ["08", "MTS Universal Testing Machine", "ICE Lab"], ["09", "Pendulum Impact Testing Machine (Charpy / Izod)", "ICE Lab"], ["10", "Torsion Test Apparatus", "ICE Lab"], ["11", "Rotating Fatigue Testing Machine", "ICE Lab"], ["12", "Forces in a Truss Apparatus", "ICE Lab"], ["13", "Bending Stress in a Beam Apparatus", "ICE Lab"], ["14", "Buckling Test Apparatus", "ICE Lab"], ["15", "Beam Apparatus", "ICE Lab"], ["16", "Pin-Jointed Frameworks Apparatus", "ICE Lab"], ["18", "Thermal Power Plant with Steam Turbine", "ICE Lab"], ["19", "Refrigeration / Heat Pump Training System", "ICE Lab"], ["20", "Heat Exchanger Service Module", "ICE Lab"], ["21", "Heat Transfer Experiment Base Unit", "ICE Lab"], ["22", "Matrix Wind Tunnel", "ICE Lab"], ["23", "TecQuipment CE111 PLC Process Trainer", "ICE Lab"], ["25", "TecQuipment CE117 Process Trainer", "ICE Lab"], ["26", "Series and Parallel Pumps Apparatus", "ICE Lab"], ["27", "TecQuipment H16 — Losses in Pipe Systems", "ICE Lab"], ["28", "Hydrostatics and Properties of Fluids Apparatus", "ICE Lab"], ["29", "Centre of Pressure Apparatus", "ICE Lab"], ["30", "Flow Measurement / Multi-Tube Manometer Apparatus", "ICE Lab"], ["31", "Rotor Dynamics / Balancing Training Rig", "ICE Lab"], ["32", "Free and Forced Vibration Apparatus", "ICE Lab"], ["ES1-1", "ES1 Work Panel (panel 1 of 3)", "ICE Lab"], ["ES1-2", "ES1 Work Panel (panel 2 of 3)", "ICE Lab"], ["ES1-3", "ES1 Work Panel (panel 3 of 3)", "ICE Lab"], ["ES2", "ES2 Forces Kit", "ICE Lab"], ["ES3", "ES3 Moments Kit", "ICE Lab"], ["ES4", "ES4 Deflection of Beams and Cantilevers Kit", "ICE Lab"], ["ES5", "ES5 Torsion of Circular Sections Kit", "ICE Lab"], ["ES6", "ES6 Tensile Tester Kit", "ICE Lab"], ["ES7", "ES7 Simple Harmonic Motion Kit", "ICE Lab"], ["ES8", "ES8 Friction and Inclined Plane Kit", "ICE Lab"], ["ES9", "ES9 Potential and Kinetic Energy Kit", "ICE Lab"], ["ES10", "ES10 Pulley Kit", "ICE Lab"], ["ES11", "ES11 Drive Systems Kit", "ICE Lab"], ["ES12", "ES12 Cam, Crank and Toggle Kit", "ICE Lab"], ["ES13", "ES13 Gear Trains Kit", "ICE Lab"], ["ES14", "ES14 Simple Mechanisms Kit", "ICE Lab"], ["ES15", "ES15 Bar Linkages Kit", "ICE Lab"], ["ES16", "ES16 Centrifugal Force Kit", "ICE Lab"], ["ES17", "ES17 Rotational Friction Kit", "ICE Lab"], ["ES18", "ES18 Additional Mechanisms Kit", "ICE Lab"], ["ES19", "ES19 Spring Tester Kit", "ICE Lab"], ["Classroom 1", "Classroom 1", "ICE Lab"], ["Classroom 2", "Classroom 2", "ICE Lab"]];
let D = null, ROWS = [], EQ = [], ROLE = 'viewer', TAB = 'overview', SORT = {};
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const fmt = (v, d) => (Math.round(v * Math.pow(10, d || 0)) / Math.pow(10, d || 0)).toLocaleString('en-GB');
const OK = ['Approved by supervisor', 'Confirmed by lab', 'Completed'], NO = ['Declined by supervisor', 'Cancelled', 'No-show'];
const stClass = s => OK.includes(s) ? 'st-ok' : s === 'Pending supervisor' ? 'st-pend' : NO.includes(s) ? 'st-no' : 'st-neu';
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const COLORS = { 'Use in the lab': '#2472a7', 'Borrow': '#cc092f', 'Classroom': '#7c2b93' };

/* ---------------- data ---------------- */
function load() {
  if (window.google && google.script && google.script.run) {
    google.script.run.withSuccessHandler(init).withFailureHandler(e => fail(e && e.message || String(e))).getData();
  } else init(demo());
}
function fail(m) { $('who').textContent = ''; $('view').innerHTML = '<div class="note err">' + esc(m) + '</div>'; }
function init(d) {
  D = d;
  if (d.error === 'no-access') { $('who').textContent = d.me || ''; $('view').innerHTML = '<div class="note err">You do not have access to the ICE Lab booking data. Ask the lab admin to share the bookings sheet with ' + esc(d.me || 'your account') + '.</div>'; document.querySelector('.filters').hidden = true; return; }
  ROLE = d.role; const H = d.head;
  const k = { 'Reference': 'ref', 'Received': 'received', 'Status': 'status', 'Lab': 'lab', 'Request': 'type', 'Code': 'code', 'Equipment or room': 'item', 'Date': 'date', 'Start': 'start', 'End': 'end', 'Borrow from': 'from', 'Return by': 'to', 'Hours': 'hours', 'Days': 'days', 'Attendees': 'att', 'Name': 'name', 'Role': 'role', 'ID': 'sid', 'Email': 'email', 'Department': 'dept', 'Course code': 'courseCode', 'Course or project': 'course', 'Description': 'desc', 'Supervisor': 'sup', 'Supervisor email': 'supEmail', 'PPE': 'ppe', 'Decided': 'decided', 'Lab note': 'note' };
  ROWS = d.rows.map(r => { const o = {}; H.forEach((h, i) => { if (k[h]) o[k[h]] = r[i]; }); o.hours = num(o.hours); o.days = num(o.days); o.day = String(o.date || o.from || o.received || '').slice(0, 10); o.courseCode = String(o.courseCode || '').trim() || '(none)'; o.sup = String(o.sup || '').trim() || '(none)'; return o; });
  EQ = d.equipment.map(r => ({ code: String(r[0]), name: r[1], lab: r[2], status: r[3], note: r[4], updated: r[5] }));
  $('who').innerHTML = esc(d.me) + '<span class="badge ' + (d.demo ? 'b-demo">Demo · sample data' : ROLE === 'admin' ? 'b-admin">Admin' : 'b-viewer">Viewer') + '</span>';
  if (d.demo) $('banner').innerHTML = '<div class="note">This is a demo with <b>sample data</b> to show what the dashboard does. Once the booking system is live, the same page reads the real Google Sheet. Try the filters, click a machine or a course, and export.</div>';
  if (d.demo) { $('hdbtns').innerHTML = '<label class="who">Preview as <select id="asrole"><option value="viewer">Viewer (dean, doctors)</option><option value="admin">Admin (you)</option></select></label>'; $('asrole').onchange = e => { ROLE = e.target.value; $('who').innerHTML = 'you (demo)<span class="badge b-demo">Demo · sample data</span><span class="badge ' + (ROLE === 'admin' ? 'b-admin">Admin' : 'b-viewer">Viewer') + '</span>'; render(); }; }
  if (ROLE === 'admin' && d.sheetUrl) $('hdbtns').innerHTML = '<a class="btn" href="' + esc(d.sheetUrl) + '" target="_blank" rel="noopener">Open the sheet</a>';
  fillFilters(); tabs(); render();
}
const opts = (id, vals, all) => { const el = $(id), cur = el.value; el.innerHTML = '<option value="">' + all + '</option>' + vals.map(v => '<option value="' + esc(v[0]) + '">' + esc(v[1]) + '</option>').join(''); if ([...el.options].some(o => o.value === cur)) el.value = cur; };
function uniq(f) { const m = new Map(); ROWS.forEach(r => { const v = f(r); if (v && !m.has(v)) m.set(v, v); }); return [...m.keys()].sort((a, b) => String(a).localeCompare(String(b), 'en', { numeric: true })); }
function fillFilters() {
  opts('f-lab', uniq(r => r.lab).map(v => [v, v]), 'All labs');
  const eqName = c => (EQ.find(e => e.code === c) || {}).name || '';
  opts('f-eq', uniq(r => r.code).map(c => [c, c + (eqName(c) && eqName(c) !== c ? ' · ' + eqName(c) : '')]), 'All equipment');
  opts('f-course', uniq(r => r.courseCode).map(v => [v, v]), 'All courses');
  opts('f-sup', uniq(r => r.sup).map(v => [v, v]), 'All supervisors');
  opts('f-dept', uniq(r => r.dept).map(v => [v, v]), 'All departments');
  opts('f-type', uniq(r => r.type).map(v => [v, v]), 'All types');
  ['f-from', 'f-to', 'f-lab', 'f-eq', 'f-course', 'f-sup', 'f-dept', 'f-type', 'f-status'].forEach(id => $(id).onchange = render);
  $('f-reset').onclick = () => { ['f-from', 'f-to', 'f-lab', 'f-eq', 'f-course', 'f-sup', 'f-dept', 'f-type'].forEach(id => $(id).value = ''); $('f-status').value = 'active'; render(); };
}
function filtered(anyStatus) {
  const f = id => $(id).value, st = anyStatus ? 'all' : f('f-status');
  return ROWS.filter(r => (!f('f-from') || r.day >= f('f-from')) && (!f('f-to') || r.day <= f('f-to')) && (!f('f-lab') || r.lab === f('f-lab')) && (!f('f-eq') || r.code === f('f-eq')) &&
    (!f('f-course') || r.courseCode === f('f-course')) && (!f('f-sup') || r.sup === f('f-sup')) && (!f('f-dept') || r.dept === f('f-dept')) && (!f('f-type') || r.type === f('f-type')) &&
    (st === 'all' || (st === 'active' && !NO.includes(r.status)) || (st === 'ok' && OK.includes(r.status)) || (st === 'pend' && r.status === 'Pending supervisor') || (st === 'no' && NO.includes(r.status))));
}
function setFilter(id, v) { $(id).value = v; TAB = 'overview'; tabs(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

/* ---------------- aggregation ---------------- */
function group(rows, key, extra) {
  const m = new Map();
  rows.forEach(r => { const k = key(r); if (k == null || k === '') return; if (!m.has(k)) m.set(k, { key: k, n: 0, ok: 0, hours: 0, days: 0, students: new Set(), courses: new Set(), sups: new Set(), machines: new Set(), last: '' }); const g = m.get(k);
    g.n++; if (OK.includes(r.status)) g.ok++; g.hours += r.hours; g.days += r.days; if (r.sid || r.email) g.students.add(r.sid || r.email); if (r.courseCode && r.courseCode !== '(none)') g.courses.add(r.courseCode); if (r.sup && r.sup !== '(none)') g.sups.add(r.sup); if (r.code) g.machines.add(r.code); if (r.day > g.last) g.last = r.day; if (extra) extra(g, r); });
  return [...m.values()];
}
function weekStart(d) { const t = new Date(d + 'T00:00:00'); if (isNaN(t)) return ''; const w = (t.getDay() + 6) % 7; t.setDate(t.getDate() - w); return iso(t); }

/* ---------------- views ---------------- */
const TABS = [['overview', 'Overview'], ['machines', 'Machines'], ['courses', 'Courses'], ['sups', 'Supervisors'], ['depts', 'Departments'], ['requests', 'Requests'], ['equipment', 'Equipment']];
function tabs() { $('tabs').innerHTML = TABS.map(([k, l]) => '<button role="tab" type="button" aria-selected="' + (k === TAB) + '" data-t="' + k + '">' + l + '</button>').join(''); $('tabs').querySelectorAll('button').forEach(b => b.onclick = () => { TAB = b.dataset.t; tabs(); render(); }); }
function render() { const rows = filtered(); ({ overview, machines, courses, sups, depts, requests, equipment })[TAB](rows); }

function kpis(rows) {
  const all = filtered(true), ok = all.filter(r => OK.includes(r.status) || r.status === 'No-show').length, decided = all.filter(r => r.status !== 'Pending supervisor' && r.status !== 'Cancelled').length;
  const K = [['Requests', fmt(rows.length), rows.length ? 'in the selection' : 'no requests match'], ['Approved', decided ? fmt(ok / decided * 100) + ' %' : '–', 'of ' + decided + ' decided by supervisors'],
    ['Lab hours booked', fmt(rows.reduce((t, r) => t + r.hours, 0), 1), 'sessions in the lab'], ['Borrow days', fmt(rows.reduce((t, r) => t + r.days, 0)), 'equipment out on loan'],
    ['Students', fmt(new Set(rows.map(r => r.sid || r.email)).size), 'different requesters'], ['Courses', fmt(new Set(rows.map(r => r.courseCode).filter(c => c !== '(none)')).size), 'course codes served'],
    ['Supervisors', fmt(new Set(rows.map(r => r.sup).filter(c => c !== '(none)')).size), 'faculty involved']];
  return '<div class="kpis">' + K.map(k => '<div class="kpi"><div class="l">' + k[0] + '</div><div class="v">' + k[1] + '</div><div class="s">' + k[2] + '</div></div>').join('') + '</div>';
}
function overview(rows) {
  if (!rows.length) { $('view').innerHTML = kpis(rows) + '<div class="empty">No requests match the filters.</div>'; return; }
  const wk = group(rows, r => weekStart(r.day)).sort((a, b) => a.key < b.key ? -1 : 1);
  const mach = group(rows, r => r.code).map(g => (g.name = (EQ.find(e => e.code === g.key) || {}).name || g.key, g)).sort((a, b) => b.hours - a.hours).filter(g => g.hours > 0).slice(0, 10);
  const totH = rows.reduce((t, r) => t + r.hours, 0) || 1;
  const types = group(rows, r => r.type).sort((a, b) => b.n - a.n);
  const dep = group(rows, r => r.dept).sort((a, b) => b.n - a.n).slice(0, 8);
  const crs = group(rows, r => r.courseCode).filter(g => g.key !== '(none)').sort((a, b) => b.n - a.n).slice(0, 10);
  $('view').innerHTML = kpis(rows) + '<div class="grid">' +
    card('Requests per week', 'Week starting Monday · hover a bar', barsV(wk.map(g => [g.key.slice(5), g.n, g.key + ': ' + g.n + ' requests, ' + fmt(g.hours, 1) + ' h']))) +
    card('Lab hours by machine', 'Top 10 · share of all lab hours in the selection · click to filter', barsH(mach.map(g => [g.key + ' · ' + g.name, g.hours, fmt(g.hours, 1) + ' h · ' + fmt(g.hours / totH * 100) + ' %', g.key + ' · ' + g.name + '\n' + g.n + ' requests, ' + fmt(g.hours, 1) + ' h, ' + g.days + ' borrow days\n' + g.courses.size + ' courses', g.key]), 'f-eq')) +
    card('Request type', 'Share of requests', stack(types.map(g => [g.key, g.n, COLORS[g.key] || '#b3b3b3']), rows.length)) +
    card('When the lab is busy', 'Booked hours by weekday and start time', heat(rows)) +
    card('Top courses', 'Requests per course code · click to filter', barsH(crs.map(g => [g.key, g.n, g.n + ' · ' + g.machines.size + ' machines', g.key + '\n' + g.n + ' requests, ' + fmt(g.hours, 1) + ' h\nMachines: ' + [...g.machines].join(', '), g.key]), 'f-course')) +
    card('Departments', 'Requests per department · click to filter', barsH(dep.map(g => [g.key, g.n, g.n + ' (' + fmt(g.n / rows.length * 100) + ' %)', g.key + ': ' + g.n + ' requests', g.key]), 'f-dept')) +
    '</div>';
  wire();
}
function card(t, s, body, extra) { return '<div class="card"><div class="ch"><div><h3>' + esc(t) + '</h3><p class="sub">' + esc(s) + '</p></div>' + (extra || '') + '</div>' + body + '</div>'; }

/* charts: thin marks, rounded data-ends, recessive grid, hover tips */
function barsV(data) {
  if (!data.length) return '<div class="empty">No data</div>';
  const W = 640, H = 230, L = 34, B = 26, T = 10, mx = Math.max(...data.map(d => d[1])) || 1, n = data.length, bw = Math.max(4, Math.min(30, (W - L) / n - 6)), step = (W - L) / n;

  for (let i = 0; i < 12; i++) { const ds = new Date(start.getTime() + (3 + i * 5) * 864e5); while (ds.getDay() > 4) ds.setDate(ds.getDate() + 1); const d = iso(ds); rows.push(['ICE-' + d.replace(/-/g, '') + '-R' + i, d + ' 08:30', 'Completed', 'ICE Lab', 'Classroom', 'Classroom ' + (1 + i % 2), 'Classroom ' + (1 + i % 2), d, '10:00', '12:00', '', '', 2, '', 25, 'Dr Example ' + 'ABCDEF'[i % 6], 'Staff', 'S-1' + i, 'staff' + i + '@example.edu', 'Mechanical Engineering', 'MECH 310', 'MECH 310', 'Lecture', 'Dr Example ' + 'ABCDEF'[i % 6], '', 'Yes', '', '']); }
  const head = ['Reference', 'Received', 'Status', 'Lab', 'Request', 'Code', 'Equipment or room', 'Date', 'Start', 'End', 'Borrow from', 'Return by', 'Hours', 'Days', 'Attendees', 'Name', 'Role', 'ID', 'Email', 'Department', 'Course code', 'Course or project', 'Description', 'Supervisor', 'Supervisor email', 'PPE', 'Decided', 'Lab note'];
  const eqRows = DEMO_EQUIPMENT.map(e => [e[0], e[1], e[2], e[0] === '04' ? 'Under maintenance' : e[0] === 'M-11' ? 'Out of service' : 'Operational', e[0] === '04' ? 'Blade replacement' : e[0] === 'M-11' ? 'Waiting for wire' : '', '2026-11-01']);
  return { demo: true, me: 'you (demo)', role: 'viewer', head, rows, equipment: eqRows, admins: ['you@aubh.edu.bh'], sheetUrl: '', statuses: ['Pending supervisor', 'Approved by supervisor', 'Declined by supervisor', 'Confirmed by lab', 'Completed', 'No-show', 'Cancelled'], eqStatuses: ['Operational', 'Under maintenance', 'Out of service'] };

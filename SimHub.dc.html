<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="ICE Lab, American University of Bahrain: equipment catalog, lab booking, 30 virtual benches with data analysis and calibration, and the Manufacturing Lab with its own machine simulations.">
<meta name="theme-color" content="#0039a6">
<link rel="icon" type="image/png" href="img/ice-mark.png">
<meta property="og:title" content="ICE Lab · American University of Bahrain">
<meta property="og:description" content="Book lab equipment, run the virtual benches and analyse your data.">
<meta property="og:image" content="img/ice-mark.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ICE Lab Virtual Bench</title>
<script src="./support.js"></script>
<style>body{font-variant-numeric:lining-nums tabular-nums;-webkit-font-smoothing:antialiased}h1,h2,h3{font-variant-numeric:lining-nums}h1,h2{color:#0039a6!important}header h1,header h2,footer[style*="background"] h2{color:#fff!important}footer[style*="background"] a,footer[style*="background"] a:visited{color:#fff!important}</style></head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-tpl">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&amp;family=Raleway:wght@400;500;600;700&amp;family=Changa:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#ffffff}
a{color:#0039a6}a:hover{color:#3d4757}
.vb-rail a:hover{background:#ffffff}
.vb-card{transition:border-color .2s ease,transform .2s ease}
.vb-card:hover{transform:translateY(-2px)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</helmet>
<div style="font-family: 'Raleway', 'Changa', system-ui, sans-serif; font-size: 15px; line-height: 1.5; color: #1b2433; background: #ffffff; min-height: 100vh; color-scheme: dark">

<style>.ice-hd{position:sticky;top:0;z-index:20;background:#0039a6;backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.28);font-family:"IBM Plex Sans",system-ui,sans-serif}.ice-hd .in{max-width:1400px;margin:0 auto;padding:10px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;box-sizing:border-box}.ice-hd .brand{display:flex;align-items:center;gap:12px;text-decoration:none}.ice-hd .brand img{height:30px;width:auto}.ice-hd nav{display:flex;flex-wrap:wrap;gap:2px;flex:1 1 auto;justify-content:flex-end}.ice-hd nav a{color:#e3e9f6;text-decoration:none;padding:10px 12px;font-size:15px;white-space:nowrap}.ice-hd nav a:hover{color:#ffffff}.ice-hd nav a[aria-current]{color:#ffffff;font-weight:600;box-shadow:inset 0 -2px 0 #0039a6}@media (max-width:720px){.ice-hd .in{padding:8px 12px;gap:8px}.ice-hd nav{flex:1 1 100%;min-width:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin:0}.ice-hd nav a{padding:9px 2px;font-size:13.5px;text-align:center;border-radius:6px;background:#0039a6;border:1px solid rgba(255,255,255,.28);overflow:hidden;text-overflow:ellipsis}.ice-hd nav a[aria-current]{box-shadow:none;background:#ffffff;border-color:rgba(255,255,255,.28);color:#0039a6}}@media (max-width:360px){.ice-hd nav a{font-size:12.5px;padding:9px 0;letter-spacing:-.01em}}@media (pointer:coarse){button[role=tab]{position:relative}button[role=tab]::after{content:"";position:absolute;inset:-16px -5px}a[href="Main.dc.html"]:not(nav a),footer a{display:inline-block;padding:8px 0}}@media (max-width:720px){#q{width:100%;min-width:0;box-sizing:border-box}div:has(>#q){min-width:0;flex:1 1 100%!important}input:not([type=range]):not([type=checkbox]):not([type=radio]),select,textarea{font-size:16px!important}}</style><header class="ice-hd"><div class="in"><a class="brand" href="Home.dc.html" aria-label="ICE Lab home"><img src="img/ice-mark.png" alt=""><img src="img/ice-wordmark.png" alt="ICE LAB"></a><nav aria-label="Main"><a href="Home.dc.html">Home</a><a href="Main.dc.html">Equipment</a><a href="SimHub.dc.html" aria-current="page">Simulation</a><a href="Manufacturing.dc.html">Manufacturing</a><a href="Booking.dc.html">Book</a><a href="MyBookings.dc.html">My requests</a></nav></div></header>

<div style="max-width: 1400px; margin: 0 auto; padding: 0 24px 48px">
<div style="padding: 26px 0 18px; display: grid; gap: 8px">
<p style="margin: 0; font-family: 'Raleway', 'Changa', system-ui, sans-serif; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #5c6f7c">American University of Bahrain · ICE Lab · Virtual equipment</p>
<h1 style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-weight: 700; font-size: 54px; line-height: 1; ">ICE Lab Virtual Bench</h1>
<p style="margin: 0; max-width: 72ch; color: #5c6f7c">Simulations of the lab’s own equipment, grouped by the section colours on the equipment tags. Each bench has the apparatus, live instrument readings, a logbook and the analysis students do in the lab.</p>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; padding: 14px 18px; border-radius: 8px; border: 1px solid #c5cddd; background: linear-gradient(135deg, rgba(0,57,166,.08), rgba(11,51,201,.06))">
<p style="margin: 0; font-size: 14px; color: #3d4757"><b style="color: #1b2433; font-weight: 600">All 30 benches are live.</b> Pick any bench below to run the experiment right here.</p>
<a href="bench.html" style="display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 18px; border-radius: 6px; background: linear-gradient(135deg, #0039a6, #0039a6); color: #ffffff; text-decoration: none; font-weight: 600; font-size: 14px">Open the Virtual Bench</a>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start">

<nav class="vb-rail" aria-label="Equipment" style="flex: 0 0 250px; max-width: 100%; display: grid; gap: 14px">
<a href="SimHub.dc.html" aria-current="page" style="font-family: 'Raleway', 'Changa', system-ui, sans-serif; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: #1b2433; text-decoration: none; padding: 4px 0">All equipment</a>
<sc-for list="{{rail}}" as="sec" hint-placeholder-count="6">
<div style="display: grid; grid-template-columns: 6px minmax(0, 1fr); gap: 10px">
<div style="background: {{sec.color}}; border-radius: 2px"></div>
<div>
<h2 style="margin: 0 0 4px; font-family: 'Playfair Display', Georgia, serif; font-weight: 700; font-size: 16px; color: {{sec.color}}">{{sec.name}}</h2>
<ul style="list-style: none; margin: 0; padding: 0; display: grid; gap: 1px">
<sc-for list="{{sec.items}}" as="b" hint-placeholder-count="4">
<li><a href="{{b.href}}" style="display: flex; justify-content: space-between; gap: 8px; padding: 4px 8px; border-radius: 4px; color: #1b2433; text-decoration: none; font-size: 13.5px">{{b.short}}<span style="font-family: 'Raleway', 'Changa', system-ui, sans-serif; font-size: 11px; color: #5c6f7c; white-space: nowrap">{{b.model}}</span></a></li>
</sc-for>
</ul>
</div>
</div>
</sc-for>
</nav>

<main style="flex: 1 1 600px; min-width: 0; display: grid; gap: 22px">
<sc-for list="{{rail}}" as="sec" hint-placeholder-count="6">
<section style="display: grid; gap: 10px">
<h2 style="margin: 0; display: flex; align-items: baseline; gap: 12px; font-family: 'Playfair Display', Georgia, serif; font-weight: 600; font-size: 17px; color: {{sec.color}}"><span aria-hidden="true" style="width: 22px; height: 8px; border-radius: 2px; background: {{sec.color}}; align-self: center"></span>{{sec.name}} <small style="font-family: 'Raleway', 'Changa', system-ui, sans-serif; font-weight: 400; font-size: 11px; letter-spacing: .03em; text-transform: none; color: #5c6f7c">{{sec.count}}</small></h2>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px">
<sc-for list="{{sec.items}}" as="b" hint-placeholder-count="4">
<a href="{{b.href}}" class="vb-card" style="display: grid; grid-template-columns: 5px minmax(0, 1fr); gap: 12px; padding: 12px 14px 12px 0; border-radius: 6px; border: 1px solid #dfe3ea; background: #f5f6f8; color: #1b2433; text-decoration: none; overflow: hidden">
<span style="background: {{sec.color}}"></span>
<div>
<sc-if value="{{b.img}}" hint-placeholder-val="{{true}}"><img src="{{b.img}}" alt="" loading="lazy" style="display: block; width: 100%; aspect-ratio: 640 / 420; object-fit: cover; border-radius: 4px; margin-bottom: 10px; background: #e8edf7"></sc-if>
<b style="display: block; font-family: 'Playfair Display', Georgia, serif; font-weight: 600; font-size: 21px; line-height: 1.05; ">{{b.short}}</b>
<span style="display: block; margin-top: 4px; font-family: 'Raleway', 'Changa', system-ui, sans-serif; font-size: 11px; color: #5c6f7c">{{b.model}}</span>
<small style="display: block; margin-top: 6px; font-size: 12.5px; line-height: 1.4; color: #5c6f7c">{{b.full}}</small>
</div>
</a>
</sc-for>
</div>
</section>
</sc-for>
</main>
</div>

<footer style="margin-top: 28px; padding-top: 18px; border-top: 1px solid #e3e6ec; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; font-size: 12px; color: #5c6f7c">
<span>Simulated readings include instrument noise. Specifications follow the manufacturers’ datasheets where published; other values are typical textbook figures for teaching.</span>
<span style="display: inline-flex; align-items: center; padding: 5px 9px; border-radius: 6px; background: #FFFFFF"><img src="img/aub-logo.png" alt="American University of Bahrain" style="height: 26px; width: auto"></span>
</footer>
</div>
</div>
</script>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2400}}'>
class Component extends DCLogic {
  renderVals() {
    const SECS = [
      ['mat', 'Materials Science', '#D9A05A'], ['solid', 'Solid Mechanics', '#9AABBF'], ['vib', 'Vibration', '#B48CF0'],
      ['fluids', 'Fluids', '#6AA8EC'], ['thermo', 'Thermo', '#F0895A'], ['ctrl', 'Control', '#4FC2B6']
    ];
    const B = [["mat", "Tensile test", "MTS", "MTS universal testing machine, 100 kN load frame", "tensile"], ["mat", "Impact test", "Charpy / Izod", "Pendulum impact tester for Charpy and Izod specimens", "charpy"], ["mat", "Vickers hardness", "HV", "Vickers hardness tester with measuring microscope", "vickers"], ["mat", "Fatigue test", "HSM19D", "Rotating fatigue testing machine", "fatigue"], ["mat", "Metallography", "Microscope", "Grinding/polishing station, etch and metallurgical microscope", "metallography"], ["solid", "Torsion test", "Torsion", "Torsion testing machine with geared drive and torque meter", "torsion"], ["solid", "Pin-jointed frame", "Frameworks", "Truss frame with strain-gauged members and load hanger", "frameworks"], ["solid", "Beam deflection", "Beams", "Beam apparatus with knife-edge supports, clamp, dial gauge and load hangers", "beams"], ["solid", "Buckling of struts", "Struts", "Strut buckling apparatus with screw loading, load cell and dial gauge", "buckling"], ["solid", "ES kit: springs", "ES kits", "Engineering science kit: springs, hanger and slotted masses", "eskit"], ["vib", "Free & forced vibration", "TM1016V", "TecQuipment TM1016V: beam 1.65 kg × 0.815 m, spring 3800 N/m at 0.75 m, exciter 4.2 kg at 0.4 m", "tm1016v"], ["vib", "Rotor dynamics", "Rotor rig", "Rotor dynamics rig with variable-speed motor and guard rings", "whirling"], ["fluids", "Impact of a jet", "H8", "TecQuipment H8 on the H1F bench (jockey 600 g · nozzle Ø10 mm · vane/pivot 150 mm)", "h8"], ["fluids", "Bernoulli's theorem", "H5", "TecQuipment H5 venturi meter on the H1F bench · tappings A–L · throat Ø16.00 mm at D", "bernoulli"], ["fluids", "Losses in piping", "H16", "TecQuipment H16 losses in piping systems, supplied by the H1F bench", "h16"], ["fluids", "Osborne Reynolds", "H215", "TecQuipment H215 Osborne Reynolds apparatus, Ø10 mm glass test tube, fed from the H1F bench", "h215"], ["fluids", "Flow channel", "FC50", "TecQuipment FC50 flow channel, 2.5 m long × 53 mm wide, supplied by the H1F bench", "fc50"], ["fluids", "Series & parallel pumps", "H52", "TecQuipment H52 series and parallel pump test set: two identical pumps, valves V1–V5, gauges and flow meter", "h52"], ["fluids", "Centre of pressure", "H11", "TecQuipment H11 centre of pressure apparatus: quadrant tank B 75 mm, R₁ 100 mm, R₂ 200 mm", "h11"], ["fluids", "Hydrostatics bench", "H314", "TecQuipment H314 hydrostatics and properties of fluids apparatus", "h314"], ["fluids", "Wind tunnel", "Matrix", "Matrix TSL wind tunnel, 300 × 300 mm test section, three-component balance and 12-tube pressure manifold", "windtunnel"], ["thermo", "Heat exchangers", "TD360", "TecQuipment TD360 service module with concentric tube, plate or shell-and-tube exchanger", "td360"], ["thermo", "Linear conduction", "TD1002", "TecQuipment TD1002 base unit with TD1002a linear heat conduction experiment", "td1002"], ["thermo", "Free & forced convection", "TD1005V", "TecQuipment TD1005V free and forced convection", "td1005"], ["thermo", "Steam turbine", "TD1060V", "TecQuipment TD1060V: flash boiler, 30-blade turbine, air-cooled condenser and generator dynamometer", "td1060v"], ["thermo", "Turbojet", "GT100", "TecQuipment GT100 turbojet, control and instrument panel", "gt100"], ["thermo", "Air conditioning", "EC1501V", "TecQuipment EC1501V air conditioning trainer (R134a)", "ec1501"], ["thermo", "Wind energy", "GES-28001", "GES-28001 wind energy baseplate with GES-23001 wind energy module", "wind"], ["ctrl", "PLC trainer & process", "CE123 + CE111", "TecQuipment CE123 PLC trainer connected to the CE111 two-tank process", "plc"], ["ctrl", "Process trainer", "CE117", "TecQuipment CE117 process trainer", "ce117"]];
    const IMGS = {"tensile": "ice-08", "charpy": "ice-09", "vickers": "ice-03", "fatigue": "ice-11", "metallography": "ice-01", "torsion": "ice-10", "frameworks": "ice-16", "beams": "ice-15", "buckling": "ice-14", "tm1016v": "ice-32", "whirling": "ice-31", "h16": "ice-27", "h52": "ice-26", "h11": "ice-29", "h314": "ice-28", "windtunnel": "ice-22", "td360": "ice-20", "td1002": "ice-21", "td1005": "ice-21", "td1060v": "ice-18", "gt100": "ice-17", "ec1501": "ice-19", "wind": "ice-24", "plc": "ice-23", "ce117": "ice-25", "mlathe": "M-06", "mmill": "M-04", "cncmill": "M-07", "cnclathe": "M-08", "laser": "M-10", "hotwire": "M-11"};
    const rail = SECS.map(([id, name, color]) => {
      const items = B.filter((b) => b[0] === id).map(([, short, model, full, id]) => ({ short, model, full, href: 'bench.html#' + id, img: IMGS[id] ? 'img/eq/' + IMGS[id] + '.jpg' : '' }));
      return { name, color, items, count: items.length + ' benches' };
    });
    return { rail };
  }
}
</script>
</body>
</html>

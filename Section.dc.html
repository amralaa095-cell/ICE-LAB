<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="ICE Lab, American University of Bahrain: equipment catalog, lab booking, 30 virtual benches with data analysis and calibration, and the Manufacturing Lab with its own machine simulations.">
<meta name="theme-color" content="#0039a6">
<link rel="icon" type="image/png" href="img/ice-mark.png">
<meta property="og:title" content="ICE Lab · American University of Bahrain">
<meta property="og:description" content="Book lab equipment, run the virtual benches and analyse your data.">
<meta property="og:image" content="img/ice-mark.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ICE Lab section</title>
<script src="./support.js"></script>
<style>body,input,select,button,table{font-feature-settings:"lnum" 1,"tnum" 1}body{font-variant-numeric:lining-nums tabular-nums;-webkit-font-smoothing:antialiased}h1,h2,h3{font-variant-numeric:lining-nums}h1,h2{color:#0039a6!important}header h1,header h2,footer[style*="background"] h2{color:#fff!important}footer[style*="background"] a,footer[style*="background"] a:visited{color:#fff!important}</style></head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-tpl">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&amp;family=Raleway:wght@400;500;600;700&amp;family=Changa:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#ffffff}
a{color:#0039a6}a:hover{color:#3d4757}
.sx-card{transition:border-color .2s ease,transform .2s ease}
.sx-card:hover{border-color:#c5cddd;transform:translateY(-2px)}
.sx-tab:hover{background:#e8edf7}
.sx-btn:hover{filter:brightness(1.12)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</helmet>
<div style="font-family: 'Raleway', 'Changa', system-ui, sans-serif; font-size: 15px; line-height: 1.5; color: #1b2433; background: #ffffff; min-height: 100vh; color-scheme: dark">

<style>.ice-hd{position:sticky;top:0;z-index:20;background:#0039a6;backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.28);font-family:"Raleway","Changa",system-ui,sans-serif}.ice-hd .in{max-width:1400px;margin:0 auto;padding:10px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;box-sizing:border-box}.ice-hd .brand{display:flex;align-items:center;gap:12px;text-decoration:none}.ice-hd .brand img{height:30px;width:auto}.ice-hd nav{display:flex;flex-wrap:wrap;gap:2px;flex:1 1 auto;justify-content:flex-end}.ice-hd nav a{color:#e3e9f6;text-decoration:none;padding:10px 12px;font-size:15px;white-space:nowrap}.ice-hd nav a:hover{color:#ffffff}.ice-hd nav a[aria-current]{color:#ffffff;font-weight:600;box-shadow:inset 0 -2px 0 #0039a6}@media (max-width:720px){.ice-hd .in{padding:8px 12px;gap:8px}.ice-hd nav{flex:1 1 100%;min-width:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin:0}.ice-hd nav a{padding:9px 2px;font-size:13.5px;text-align:center;border-radius:6px;background:#0039a6;border:1px solid rgba(255,255,255,.28);overflow:hidden;text-overflow:ellipsis}.ice-hd nav a[aria-current]{box-shadow:none;background:#ffffff;border-color:rgba(255,255,255,.28);color:#0039a6}}@media (max-width:360px){.ice-hd nav a{font-size:12.5px;padding:9px 0;letter-spacing:-.01em}}@media (pointer:coarse){button[role=tab]{position:relative}button[role=tab]::after{content:"";position:absolute;inset:-16px -5px}a[href="Main.dc.html"]:not(nav a),footer a{display:inline-block;padding:8px 0}}@media (max-width:720px){#q{width:100%;min-width:0;box-sizing:border-box}div:has(>#q){min-width:0;flex:1 1 100%!important}input:not([type=range]):not([type=checkbox]):not([type=radio]),select,textarea{font-size:16px!important}}</style><header class="ice-hd"><div class="in"><a class="brand" href="Home.dc.html" aria-label="ICE Lab home"><img src="img/ice-mark.png" alt=""><img src="img/ice-wordmark.png" alt="ICE LAB"></a><nav aria-label="Main"><a href="Home.dc.html" aria-current="page">Home</a><a href="Main.dc.html">Equipment</a><a href="SimHub.dc.html">Simulation</a><a href="Manufacturing.dc.html">Manufacturing</a><a href="Booking.dc.html">Book</a><a href="MyBookings.dc.html">My requests</a></nav></div></header>

<main style="max-width: 1400px; margin: 0 auto; padding: 0 24px 56px">
<div style="padding: 30px 0 8px; display: grid; gap: 10px">
<p style="margin: 0; font-family: 'Raleway', 'Changa', system-ui, sans-serif; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #0039a6">ICE Lab · {{cur.code}}</p>
<div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap">
<span style="width: 56px; height: 64px; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: linear-gradient(150deg, #0039a6, #0039a6); display: flex; align-items: center; justify-content: center; flex: 0 0 auto">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{cur.icon}}"></path></svg>
</span>
<h1 style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-weight: 800; font-size: 44px; line-height: 1.05">{{cur.name}}</h1>
<span style="font-family: 'Raleway', 'Changa', system-ui, sans-serif; font-size: 13px; padding: 6px 12px; border-radius: 999px; border: 1px solid #c5cddd; color: #1b2433">{{cur.count}}</span>
</div>
<p style="margin: 0; max-width: 72ch; font-size: 17px; line-height: 1.6; color: #3d4757">{{cur.what}}</p>
</div>

<nav aria-label="Sections" style="display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 0 24px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="6">
<sc-if value="{{t.on}}" hint-placeholder-val="{{false}}"><a href="{{t.href}}" aria-current="page" onClick="{{t.pick}}" style="display: inline-flex; align-items: center; height: 40px; padding: 0 16px; border-radius: 999px; background: linear-gradient(135deg, #0039a6, #0039a6); color: #ffffff; text-decoration: none; font-weight: 600; font-size: 14px">{{t.name}}</a></sc-if>
<sc-if value="{{t.off}}" hint-placeholder-val="{{true}}"><a href="{{t.href}}" class="sx-tab" onClick="{{t.pick}}" style="display: inline-flex; align-items: center; height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid #c5cddd; color: #1b2433; text-decoration: none; font-size: 14px">{{t.name}}</a></sc-if>
</sc-for>
</nav>

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 16px">
<sc-for list="{{items}}" as="m" hint-placeholder-count="6">
<article class="sx-card" style="display: flex; flex-direction: column; gap: 12px; padding: 16px 16px 16px; border-radius: 12px; border: 1px solid #dfe3ea; background: #f5f6f8">
<img src="{{m.img}}" alt="{{m.name}}" loading="lazy" style="width: 100%; aspect-ratio: 640 / 420; object-fit: cover; border-radius: 8px; background: #e8edf7; display: block">
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
<span style="font-family: 'Raleway', 'Changa', system-ui, sans-serif; font-size: 12px; color: #0039a6">{{m.no}}</span>
<sc-if value="{{m.ok}}" hint-placeholder-val="{{true}}"><span style="font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: #e2f4e9; color: #16703f">Operational</span></sc-if>
<sc-if value="{{m.maint}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: #fff3d1; color: #8a5a00">Needs maintenance</span></sc-if>
<sc-if value="{{m.out}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: #fde6eb; color: #cc092f">Out of service</span></sc-if>
</div>
<h2 style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-weight: 700; font-size: 19px; line-height: 1.25">{{m.name}}</h2>
<p style="margin: 0; font-size: 14.5px; line-height: 1.6; color: #3d4757">{{m.desc}}</p>
<p style="margin: 0; font-size: 13px; line-height: 1.5; color: #5c6f7c"><span style="color: #3d4757; font-weight: 600">Accessories:</span> {{m.extra}}</p>
<p style="margin: 0; font-size: 13px; line-height: 1.5; color: #5c6f7c"><span style="color: #3d4757; font-weight: 600">Booking:</span> {{m.rule}}</p>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 600; letter-spacing: .04em; color: #8a5a00">Required PPE</span><ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{m.ppe}}" as="p" hint-placeholder-count="3"><li title="{{p.t}} {{p.s}}" style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 999px; border: 1px solid #ecd798; background: #fff8e3; font-size: 12.5px; color: #1b2433"><span aria-hidden="true" style="font-size: 15px; line-height: 1">{{p.e}}</span><span>{{p.t}}</span><span style="font-family: 'Raleway', 'Changa', system-ui, sans-serif; font-size: 12px; color: #5c6f7c">{{p.s}}</span></li></sc-for></ul></div>
<div style="margin-top: auto; padding-top: 4px; display: grid; grid-template-columns: {{m.cols}}; gap: 10px">
<sc-if value="{{m.ok}}" hint-placeholder-val="{{true}}"><a href="{{m.book}}" class="sx-btn" style="display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 8px; background: linear-gradient(135deg, #0039a6, #0039a6); color: #ffffff; text-decoration: none; font-weight: 600; font-size: 15px">Book</a></sc-if>
<sc-if value="{{m.blocked}}" hint-placeholder-val="{{false}}"><button type="button" disabled="" style="height: 44px; border: 0; border-radius: 8px; background: #ffffff; color: #5c6f7c; font: inherit; font-size: 15px">Not bookable</button></sc-if>
<sc-if value="{{m.sim}}" hint-placeholder-val="{{true}}"><a href="{{m.sim}}" class="sx-btn" style="display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 8px; border: 1px solid #c5cddd; background: #ffffff; color: #1b2433; text-decoration: none; font-weight: 600; font-size: 15px">Simulation</a></sc-if>
</div>
</article>
</sc-for>
</div>

<footer style="margin-top: 36px; padding-top: 18px; border-top: 1px solid #e3e6ec; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; font-size: 12px; color: #5c6f7c">
<span>Booking requests are reviewed by the lab team and your supervisor.</span>
<span style="display: inline-flex; align-items: center; padding: 5px 9px; border-radius: 6px; background: #FFFFFF"><img src="img/aub-logo.png" alt="American University of Bahrain" style="height: 26px; width: auto"></span>
</footer>
</main>
</div>
</script>

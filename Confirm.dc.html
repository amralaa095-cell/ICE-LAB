<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="ICE Lab, American University of Bahrain: equipment catalog, lab booking, 30 virtual benches with data analysis and calibration, and the Manufacturing Lab with its own machine simulations.">
<meta name="theme-color" content="#050A1A">
<link rel="icon" type="image/png" href="img/ice-mark.png">
<meta property="og:title" content="ICE Lab · American University of Bahrain">
<meta property="og:description" content="Book lab equipment, run the virtual benches and analyse your data.">
<meta property="og:image" content="img/ice-mark.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request submitted · ICE Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap">
<style>
:root{color-scheme:dark}
body{margin:0;background:#050A1A;color:#E8ECF8;font-family:"IBM Plex Sans",system-ui,sans-serif}
a{color:#8FB3FF}a:hover{color:#C3D5FF}
main{max-width:960px;margin:0 auto;padding:40px 24px 72px;box-sizing:border-box;display:flex;flex-direction:column;gap:22px}
h1{margin:0;font-family:Montserrat,sans-serif;font-size:32px;letter-spacing:-.01em}
.lede{margin:0;font-size:16px;line-height:1.55;color:#AEB9DA;max-width:640px}
.card{background:#0B1636;border:1px solid #1D2C5E;border-radius:10px;overflow:hidden}
.card .hd{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid #1D2C5E;background:#0E1A40}
.card .bd{padding:18px 22px}
.mono{font-family:"IBM Plex Mono",monospace}
dl{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:8px 18px;margin:0;font-size:15px}dt{color:#8E9AC0}dd{margin:0;overflow-wrap:anywhere}
.k{font-family:"IBM Plex Mono",monospace;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:#7E8BB3;margin:14px 0 8px}
.pill{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:600}
.pend{background:#3A2A0B;color:#FCD34D}.sent{background:#0F2E22;color:#6EE7A8}.draft{background:#3A1220;color:#FF9CB0}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;height:44px;padding:0 18px;border-radius:7px;border:1px solid #2C4699;background:#0E1A40;color:#E8ECF8;text-decoration:none;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.btn.pri{background:linear-gradient(135deg,#2A6BFF,#0B33C9);border-color:transparent;color:#fff}
.btn:hover{color:#fff;border-color:#3A7BFF}
ol.next{margin:0;padding-left:20px;display:grid;gap:8px;line-height:1.5;color:#C9D2EA}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #1D2C5E;vertical-align:top}th{color:#8E9AC0;font-weight:500;font-size:13px}
.tw{overflow-x:auto}
.note{font-size:13.5px;color:#8E9AC0;line-height:1.5}
footer{border-top:1px solid #16224A;background:#040816;color:#8E9AC0;font-size:13.5px}footer .in{max-width:960px;margin:0 auto;padding:22px 24px}
@media (max-width:600px){dl{grid-template-columns:1fr;gap:2px}dd{margin-bottom:8px}h1{font-size:26px}}
</style>
</head>
<body>
<style>.ice-hd{position:sticky;top:0;z-index:20;background:rgba(5,10,26,.92);backdrop-filter:blur(10px);border-bottom:1px solid #16224A;font-family:"IBM Plex Sans",system-ui,sans-serif}.ice-hd .in{max-width:1400px;margin:0 auto;padding:10px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;box-sizing:border-box}.ice-hd .brand{display:flex;align-items:center;gap:12px;text-decoration:none}.ice-hd .brand img{height:30px;width:auto}.ice-hd nav{display:flex;flex-wrap:wrap;gap:2px;flex:1 1 auto;justify-content:flex-end}.ice-hd nav a{color:#B7C2E2;text-decoration:none;padding:10px 12px;font-size:15px;white-space:nowrap}.ice-hd nav a:hover{color:#fff}.ice-hd nav a[aria-current]{color:#fff;font-weight:600;box-shadow:inset 0 -2px 0 #3A7BFF}@media (max-width:720px){.ice-hd .in{padding:8px 12px;gap:8px}.ice-hd nav{flex:1 1 100%;min-width:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin:0}.ice-hd nav a{padding:9px 2px;font-size:13.5px;text-align:center;border-radius:6px;background:#0B1636;border:1px solid #16224A;overflow:hidden;text-overflow:ellipsis}.ice-hd nav a[aria-current]{box-shadow:none;background:#1F55E0;border-color:#1F55E0}}@media (max-width:360px){.ice-hd nav a{font-size:12.5px;padding:9px 0;letter-spacing:-.01em}}@media (pointer:coarse){button[role=tab]{position:relative}button[role=tab]::after{content:"";position:absolute;inset:-16px -5px}a[href="Main.dc.html"]:not(nav a),footer a{display:inline-block;padding:8px 0}}@media (max-width:720px){#q{width:100%;min-width:0;box-sizing:border-box}div:has(>#q){min-width:0;flex:1 1 100%!important}input:not([type=range]):not([type=checkbox]):not([type=radio]),select,textarea{font-size:16px!important}}</style><header class="ice-hd"><div class="in"><a class="brand" href="Home.dc.html" aria-label="ICE Lab home"><img src="img/ice-mark.png" alt=""><img src="img/ice-wordmark.png" alt="ICE LAB"></a><nav aria-label="Main"><a href="Home.dc.html">Home</a><a href="Main.dc.html">Equipment</a><a href="SimHub.dc.html">Simulation</a><a href="Manufacturing.dc.html">Manufacturing</a><a href="Booking.dc.html" aria-current="page">Book</a><a href="MyBookings.dc.html">My requests</a></nav></div></header>
<main>

<div id="box"></div>

</main>
<footer><div class="in">ICE Lab · American University of Bahrain</div></footer>
<script src="config.js"></script>
<script src="booking.js"></script>
<script>
(function(){const box=document.getElementById('box');const ref=(/ref=([^&]+)/.exec(location.hash)||[])[1];const r=ref&&ICEBOOK.get(decodeURIComponent(ref));
if(!r){box.innerHTML='<h1>No request to show</h1><p class="lede">This page shows a request right after it is submitted. Your earlier requests from this device are under <a href="MyBookings.dc.html">My requests</a>.</p><div class="btns"><a class="btn pri" href="Booking.dc.html">New request</a></div>';return;}
const sent=r.status==='sent',draft=r.status==='email-draft';
box.innerHTML=`<div style="display:flex;flex-direction:column;gap:10px"><h1>${sent?'Request submitted':'Almost done: send the email'}</h1>
<p class="lede">${sent?`The lab team and your supervisor (${ICEBOOK.esc(r.supEmail)}) have your request. You get the decision by email at <b>${ICEBOOK.esc(r.email)}</b>.`:`Your email app opened with the request addressed to the lab${r.supEmail?' and your supervisor':''}. <b>Press Send there</b>, otherwise the lab does not receive it. If no email opened, use the button below.`}</p></div>
<section class="card"><div class="hd"><div><div class="note">Request reference</div><div class="mono" style="font-size:20px">${ICEBOOK.esc(r.ref)}</div></div><span class="pill ${sent?'pend':'draft'}">${sent?'Waiting for approval':'Email not sent yet'}</span></div>
<div class="bd">${ICEBOOK.dl(r)}</div></section>
${draft?`<div class="btns"><a class="btn pri" href="${ICEBOOK.mailto(r)}">Open the email again</a><button class="btn" type="button" id="cp">Copy the request text</button></div>`:''}
<section class="card"><div class="bd"><div class="k" style="margin-top:0">What happens next</div><ol class="next"><li>Your supervisor approves or declines the request.</li><li>The lab team confirms the slot (or the borrowing dates) by email.</li><li>On the day, bring your ID and the required PPE and check in at the lab desk.${r.type==='Borrow'?' Return the item by the return date.':''}</li></ol></div></section>
<div class="btns"><a class="btn" href="Booking.dc.html">New request</a><a class="btn" href="MyBookings.dc.html">My requests</a></div>`;
const cp=document.getElementById('cp');if(cp)cp.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(ICEBOOK.text(r)).then(()=>{cp.textContent='Copied';});};})();
</script>
</body>
</html>

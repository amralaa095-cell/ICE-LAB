<h1 style="margin: 0; font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 60px; line-height: 1.05; letter-spacing: -.02em; text-wrap: balance; animation: rise .8s ease 3.65s both">Test it. Measure it. <span style="font-weight: 300; color: #7FA4FF">Make it.</span></h1>
<p style="margin: 0; font-size: 19px; line-height: 1.6; color: #AEB9DA; max-width: 600px; animation: rise .8s ease 3.8s both">ICE Lab brings the American University of Bahrain’s engineering laboratories together under one roof, serving Industrial, Civil and Mechanical Engineering. Six test sections and a Manufacturing Lab, 43 machines and rigs: learn the theory, rehearse it on a virtual bench, then book the real rig and measure it.</p>

<section id="about" aria-labelledby="about-h" style="max-width: 1280px; margin: 0 auto; padding: 96px 32px 24px; display: flex; flex-direction: column; gap: 40px">

<div style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<p style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: #6E95FF">About the lab</p>
<h2 id="about-h" style="margin: 0; font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 40px; line-height: 1.12; letter-spacing: -.01em; text-wrap: balance">Where engineering theory meets measured data</h2>
</div>
<div style="flex: 1.3 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 16px; font-size: 17px; line-height: 1.7; color: #AEB9DA">
<p style="margin: 0">ICE Lab is not a single room but a group of laboratories working side by side: Solid Mechanics, Materials Science, Thermodynamics, Fluid Mechanics, Control and Vibration. Together they hold 32 pieces of teaching and research apparatus, and the Manufacturing Lab next door adds 11 manual and CNC machines for making parts. The labs serve three programmes at the American University of Bahrain: Industrial, Civil and Mechanical Engineering.</p>
<p style="margin: 0">In the lab, the equations from lectures are tested against real measurements. Students load a specimen until it fails, measure how beams, trusses and struts carry load, run a turbojet and a steam turbine, study open-channel and pipe flow, find the natural frequency of a beam and automate a live process with a PLC. Along the way they learn to plan an experiment, record clean data, judge its uncertainty and report the result as practising engineers do.</p>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 14px">
<p style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: #8E9AC0">Three programmes, one lab</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px">
<article style="display: flex; flex-direction: column; gap: 10px; padding: 26px; border-radius: 12px; border: 1px solid #2C4699; background: linear-gradient(160deg, rgba(42,107,255,.22), rgba(11,51,201,.06))">
<h3 style="margin: 0; font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 22px">Mechanical Engineering</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #AEB9DA">Thermodynamics, fluid mechanics, vibration and solid mechanics: engines, turbines, heat exchangers, pumps, the wind tunnel and rotor dynamics.</p>
</article>
<article style="display: flex; flex-direction: column; gap: 10px; padding: 26px; border-radius: 12px; border: 1px solid #2C4699; background: linear-gradient(160deg, rgba(42,107,255,.22), rgba(11,51,201,.06))">
<h3 style="margin: 0; font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 22px">Civil Engineering</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #AEB9DA">Materials testing and structures: tension, compression and shear tests, beams, trusses and struts, plus hydraulics in the flow channel and pipe rigs.</p>
</article>
<article style="display: flex; flex-direction: column; gap: 10px; padding: 26px; border-radius: 12px; border: 1px solid #2C4699; background: linear-gradient(160deg, rgba(42,107,255,.22), rgba(11,51,201,.06))">
<h3 style="margin: 0; font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 22px">Industrial Engineering</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #AEB9DA">Materials science, measurement and control: hardness, impact and fatigue testing, PLC automation and process trainers.</p>
</article>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px">
<article style="display: flex; flex-direction: column; gap: 10px; padding: 26px; border-radius: 12px; border: 1px solid #1D2C5E; background: linear-gradient(180deg, #0B1636, #08112B)">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .1em; color: #6E95FF">01</span>
<h3 style="margin: 0; font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 20px">Teaching</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #AEB9DA">Laboratory sessions for engineering courses run on industry-standard apparatus from TecQuipment, MTS and Matrix, so every group works on the same rigs used at universities worldwide.</p>
</article>
<article style="display: flex; flex-direction: column; gap: 10px; padding: 26px; border-radius: 12px; border: 1px solid #1D2C5E; background: linear-gradient(180deg, #0B1636, #08112B)">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .1em; color: #6E95FF">02</span>
<h3 style="margin: 0; font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 20px">Projects &amp; research</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #AEB9DA">Faculty, senior-design teams and research students can reserve rigs for longer studies, use the lab’s two classrooms, or borrow portable equipment with a supervisor’s approval.</p>
</article>
<article style="display: flex; flex-direction: column; gap: 10px; padding: 26px; border-radius: 12px; border: 1px solid #1D2C5E; background: linear-gradient(180deg, #0B1636, #08112B)">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .1em; color: #6E95FF">03</span>
<h3 style="margin: 0; font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 20px">Virtual benches</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #AEB9DA">30 of the rigs have a simulation that mirrors the real apparatus. Students rehearse the procedure and check their analysis before they spend time on the real machine.</p>
</article>
</div>

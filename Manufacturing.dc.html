<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="description" content="ICE Lab, American University of Bahrain: equipment catalog, lab booking, 30 virtual benches with data analysis and calibration, and the Manufacturing Lab with its own machine simulations.">
<meta name="theme-color" content="#0039a6">
<link rel="icon" type="image/png" href="img/ice-mark.png">
<meta property="og:title" content="ICE Lab · American University of Bahrain">
<meta property="og:description" content="Book lab equipment, run the virtual benches and analyse your data.">
<meta property="og:image" content="img/ice-mark.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manufacturing Lab</title>
<script src="./support.js"></script>
<style>body{font-variant-numeric:lining-nums tabular-nums;-webkit-font-smoothing:antialiased}h1,h2,h3{font-variant-numeric:lining-nums}h1,h2{color:#0039a6!important}header h1,header h2,footer[style*="background"] h2{color:#fff!important}footer[style*="background"] a,footer[style*="background"] a:visited{color:#fff!important}</style></head>
<body>
<div id="dc-root"></div>
<script type="text/x-dc-tpl">
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&amp;family=Raleway:wght@400;500;600;700&amp;family=Changa:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#ffffff}
a{color:#0039a6}a:hover{color:#3d4757}
.mf-card{transition:border-color .2s ease,transform .2s ease}
.mf-card:hover{border-color:#c5cddd;transform:translateY(-2px)}
.mf-btn{transition:filter .15s ease,background .15s ease}
.mf-btn:hover{filter:brightness(1.12)}
.mf-out:hover{background:#e8edf7}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</helmet>
<div style="font-family: 'Raleway', 'Changa', system-ui, sans-serif; font-size: 15px; line-height: 1.5; color: #1b2433; background: #ffffff; min-height: 100vh; color-scheme: dark">

<style>.ice-hd{position:sticky;top:0;z-index:20;background:#0039a6;backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.28);font-family:"IBM Plex Sans",system-ui,sans-serif}.ice-hd .in{max-width:1400px;margin:0 auto;padding:10px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;box-sizing:border-box}.ice-hd .brand{display:flex;align-items:center;gap:12px;text-decoration:none}.ice-hd .brand img{height:30px;width:auto}.ice-hd nav{display:flex;flex-wrap:wrap;gap:2px;flex:1 1 auto;justify-content:flex-end}.ice-hd nav a{color:#e3e9f6;text-decoration:none;padding:10px 12px;font-size:15px;white-space:nowrap}.ice-hd nav a:hover{color:#ffffff}.ice-hd nav a[aria-current]{color:#ffffff;font-weight:600;box-shadow:inset 0 -2px 0 #0039a6}@media (max-width:720px){.ice-hd .in{padding:8px 12px;gap:8px}.ice-hd nav{flex:1 1 100%;min-width:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin:0}.ice-hd nav a{padding:9px 2px;font-size:13.5px;text-align:center;border-radius:6px;background:#0039a6;border:1px solid rgba(255,255,255,.28);overflow:hidden;text-overflow:ellipsis}.ice-hd nav a[aria-current]{box-shadow:none;background:#ffffff;border-color:rgba(255,255,255,.28);color:#0039a6}}@media (max-width:360px){.ice-hd nav a{font-size:12.5px;padding:9px 0;letter-spacing:-.01em}}@media (pointer:coarse){button[role=tab]{position:relative}button[role=tab]::after{content:"";position:absolute;inset:-16px -5px}a[href="Main.dc.html"]:not(nav a),footer a{display:inline-block;padding:8px 0}}@media (max-width:720px){#q{width:100%;min-width:0;box-sizing:border-box}div:has(>#q){min-width:0;flex:1 1 100%!important}input:not([type=range]):not([type=checkbox]):not([type=radio]),select,textarea{font-size:16px!important}}</style><header class="ice-hd"><div class="in"><a class="brand" href="Home.dc.html" aria-label="ICE Lab home"><img src="img/ice-mark.png" alt=""><img src="img/ice-wordmark.png" alt="ICE LAB"></a><nav aria-label="Main"><a href="Home.dc.html">Home</a><a href="Main.dc.html">Equipment</a><a href="SimHub.dc.html">Simulation</a><a href="Manufacturing.dc.html" aria-current="page">Manufacturing</a><a href="Booking.dc.html">Book</a><a href="MyBookings.dc.html">My requests</a></nav></div></header>

<main style="max-width: 1400px; margin: 0 auto; padding: 0 24px 56px">
<div style="padding: 30px 0 22px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px">
<p style="margin: 0; font-family: 'Raleway', 'Changa', system-ui, sans-serif; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #5c6f7c">American University of Bahrain · Manufacturing Lab</p>
<h1 style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-weight: 700; font-size: clamp(28px, 9vw, 54px); line-height: 1; ">Manufacturing Lab</h1>
<p style="margin: 0; max-width: 74ch; color: #3d4757">Eleven desktop machines for making real parts: manual lathes and mills, a drilling machine, CNC mill and lathe, a laser cutter and a hot-wire cutter. Each machine can be booked for a session in the lab, or practised first on its simulation.</p>
<ul style="margin: 6px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px; font-family: 'Raleway', 'Changa', system-ui, sans-serif; font-size: 12px; color: #3d4757">
<li style="padding: 4px 10px; border: 1px solid #c5cddd; border-radius: 999px">11 machines</li>
<li style="padding: 4px 10px; border: 1px solid #c5cddd; border-radius: 999px">6 manual · 5 CNC</li>
<li style="padding: 4px 10px; border: 1px solid #c5cddd; border-radius: 999px">every machine has a simulation</li>
</ul>
</div>

<div style="display: grid; gap: 34px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<section style="display: grid; gap: 14px">
<h2 style="margin: 0; display: flex; align-items: baseline; gap: 12px; font-family: 'Playfair Display', Georgia, serif; font-weight: 600; font-size: 22px; color: #3f6212"><span aria-hidden="true" style="width: 22px; height: 8px; border-radius: 2px; background: #A3D65C; align-self: center"></span>{{g.title}} <small style="font-family: 'Raleway', 'Changa', system-ui, sans-serif; font-weight: 400; font-size: 12px; letter-spacing: .03em; text-transform: none; color: #5c6f7c">{{g.count}}</small></h2>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 14px">
<sc-for list="{{g.items}}" as="m" hint-placeholder-count="3">
<article class="mf-card" style="display: flex; flex-direction: column; gap: 12px; padding: 18px 18px 16px; border-radius: 10px; border: 1px solid #dfe3ea; background: #f5f6f8">
<img src="img/eq/{{m.no}}.jpg" alt="" loading="lazy" style="width: 100%; aspect-ratio: 640 / 420; object-fit: cover; border-radius: 8px; background: #e8edf7; display: block">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 10px">
<span style="font-family: 'Raleway', 'Changa', system-ui, sans-serif; font-size: 12px; color: #3f6212; letter-spacing: .06em">{{m.no}}</span>
<span style="font-family: 'Raleway', 'Changa', system-ui, sans-serif; font-size: 11.5px; color: #5c6f7c">{{m.units}}</span>
</div>
<h3 style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-weight: 600; font-size: 25px; line-height: 1.05; ">{{m.name}}</h3>
<p style="margin: 0; font-size: 14.5px; line-height: 1.55; color: #3d4757">{{m.desc}}</p>
<p style="margin: 0; font-size: 13px; line-height: 1.5; color: #5c6f7c"><span style="color: #3d4757">Tooling:</span> {{m.extra}}</p>
<p style="margin: 0; font-size: 13px; line-height: 1.5; color: #5c6f7c"><span style="color: #3d4757">Booking:</span> {{m.rule}}</p>
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 600; letter-spacing: .04em; color: #8a5a00">Required PPE</span><ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{m.ppe}}" as="p" hint-placeholder-count="3"><li title="{{p.t}} {{p.s}}" style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 999px; border: 1px solid #ecd798; background: #fff8e3; font-size: 12.5px; color: #1b2433"><span aria-hidden="true" style="font-size: 15px; line-height: 1">{{p.e}}</span><span>{{p.t}}</span><span style="font-family: 'Raleway', 'Changa', system-ui, sans-serif; font-size: 12px; color: #5c6f7c">{{p.s}}</span></li></sc-for></ul></div>
<p style="margin: 0; font-size: 13px; line-height: 1.5; color: #5c6f7c"><span style="color: #3d4757">Simulation:</span> {{m.simName}}</p>
<div style="margin-top: auto; padding-top: 6px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<a href="{{m.book}}" class="mf-btn" style="display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 8px; background: linear-gradient(135deg, #0039a6, #0039a6); color: #ffffff; text-decoration: none; font-weight: 600; font-size: 15px">Book</a>
<a href="{{m.sim}}" class="mf-btn mf-out" style="display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 8px; border: 1px solid #c5cddd; background: #ffffff; color: #1b2433; text-decoration: none; font-weight: 600; font-size: 15px">Simulation</a>
</div>
</article>
</sc-for>
</div>
</section>
</sc-for>
</div>

<footer style="margin-top: 36px; padding-top: 18px; border-top: 1px solid #e3e6ec; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; font-size: 12px; color: #5c6f7c">
<span>Booking requests are reviewed by the lab team and your supervisor. Training on the machine is required before a session in the lab.</span>
<span style="display: inline-flex; align-items: center; padding: 5px 9px; border-radius: 6px; background: #FFFFFF"><img src="img/aub-logo.png" alt="American University of Bahrain" style="height: 26px; width: auto"></span>
</footer>
</main>
</div>
</script>
